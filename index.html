  const [preset,setPreset]=useState("weekly");
  const [school,setSchool]=useState(true);
  const [swap,setSwap]=useState(false);
  const [hol,setHol]=useState(holidayCalKey||"none");
  const [code,setCode]=useState("");
  const [copied,setCopied]=useState(false);
  useEffect(()=>{if(step===5&&!code)sbClient.rpc("get_join_code",{p_cal:calId}).then(({data})=>{if(data)setCode(data)})},[step]);
  const STEPS=["Welcome","Children","Parents","Arrangement","Holidays","Invite","Done"];
  const preview=useMemo(()=>{
    const p=CUSTODY_PRESETS.find(x=>x.id===preset);
    if(!p||!p.days)return null;
    return p.days.split("").map(c=>swap?(c==="A"?"B":"A"):c);
  },[preset,swap]);
  function saveKids(){
    const clean=kids.filter(k=>k.name.trim()).map(k=>({...k,name:k.name.trim()}));
    setSettings(s=>({...s,children:clean}));
  }
  function saveParents(){
    setAssignees(prev=>({...prev,
      mommy:{...(prev.mommy||DEFAULT_ASSIGNEES.mommy),label:p1.trim()||"Parent 1"},
      daddy:{...(prev.daddy||DEFAULT_ASSIGNEES.daddy),label:p2.trim()||"Parent 2"}}));
  }
  function saveArrangement(){
    if(preset!=="custom")setTemplates(buildPresetTemplate(preset,timeBlocks,{school,swap}));
    setAnchorDate(defaultAnchor());
  }
  function next(){
    if(step===1)saveKids();
    if(step===2)saveParents();
    if(step===3)saveArrangement();
    if(step===4)setHolidayCalKey(hol);
    if(step===STEPS.length-1){onFinish(preset==="custom");return}
    setStep(s=>s+1);
  }
  const A=p1.trim()||"Parent 1",B=p2.trim()||"Parent 2";
  const kidNames=kids.filter(k=>k.name.trim()).map(k=>k.name.trim());
  return(
    <div className="wiz-backdrop">
      <div className="wiz-card" role="dialog" aria-label="Setup assistant">
        <div className="wiz-progress">
          {STEPS.map((s,i)=>(<div key={s} className={`wiz-dot${i<=step?" on":""}`} title={s}/>))}
        </div>
        <div className="wiz-step-label">Step {step+1} of {STEPS.length} · {STEPS[step]}</div>
        {step===0&&(
          <div className="wiz-body">
            <div className="wiz-emoji">👋</div>
            <h2 className="wiz-title">Let's set up “{calName}”</h2>
            <p className="wiz-text">Five short steps and your schedule is ready: your children, the two parents, your co-parenting arrangement, school holidays, and inviting your co-parent. You can change everything later.</p>
          </div>
        )}
        {step===1&&(
          <div className="wiz-body">
            <h2 className="wiz-title">👧 Who are the children?</h2>
            <p className="wiz-text">Their names appear at the top of the schedule. Birth year is optional.</p>
            {kids.map((k,i)=>(
              <div key={k.id} className="wiz-row">
                <input className="auth-input wiz-input" placeholder={i===0?"e.g. Noah":"Name"} value={k.name}
                  onChange={e=>setKids(p=>p.map(x=>x.id===k.id?{...x,name:e.target.value}:x))} autoFocus={i===0}/>
                <input className="auth-input wiz-input" style={{maxWidth:110}} inputMode="numeric" placeholder="Year" value={k.birthYear||""}
                  onChange={e=>setKids(p=>p.map(x=>x.id===k.id?{...x,birthYear:e.target.value.replace(/\D/g,"").slice(0,4)}:x))}/>
                {kids.length>1&&<button className="btn btn-danger btn-xs" onClick={()=>setKids(p=>p.filter(x=>x.id!==k.id))}>✕</button>}
              </div>
            ))}
            <button className="btn btn-ghost btn-xs" onClick={()=>setKids(p=>[...p,{id:"c_"+Date.now(),name:"",birthYear:""}])}>＋ Add another child</button>
          </div>
        )}
        {step===2&&(
          <div className="wiz-body">
            <h2 className="wiz-title">👫 The two parents</h2>
            <p className="wiz-text">These names are used for the colours in the calendar. Use first names or “Mom” and “Dad” — whatever feels right.</p>
            <label className="wiz-label"><span className="wiz-swatch" style={{background:(assignees.mommy||DEFAULT_ASSIGNEES.mommy).bg,borderColor:(assignees.mommy||DEFAULT_ASSIGNEES.mommy).fg}}/>Parent 1</label>
            <input className="auth-input wiz-input" value={p1} onChange={e=>setP1(e.target.value)} maxLength={30}/>
            <label className="wiz-label"><span className="wiz-swatch" style={{background:(assignees.daddy||DEFAULT_ASSIGNEES.daddy).bg,borderColor:(assignees.daddy||DEFAULT_ASSIGNEES.daddy).fg}}/>Parent 2</label>
            <input className="auth-input wiz-input" value={p2} onChange={e=>setP2(e.target.value)} maxLength={30}/>
          </div>
        )}
        {step===3&&(
          <div className="wiz-body">
            <h2 className="wiz-title">📆 Your co-parenting arrangement</h2>
            <p className="wiz-text">Pick the pattern closest to your agreement. It repeats every two weeks; single days can always be changed in the calendar.</p>
            <div className="wiz-presets">
              {CUSTODY_PRESETS.map(p=>(
                <button key={p.id} className={`wiz-preset${preset===p.id?" on":""}`} onClick={()=>setPreset(p.id)}>
                  <div className="wiz-preset-name">{p.name}</div>
                  <div className="wiz-preset-desc">{p.desc.replace("parent 1",A).replace("parent 2",B)}</div>
                </button>
              ))}
            </div>
            {preview&&(
              <>
                <div className="wiz-strip-label">This week · next week</div>
                <div className="wiz-strip">
                  {preview.map((c,i)=>{
                    const a=c==="A"?(assignees.mommy||DEFAULT_ASSIGNEES.mommy):(assignees.daddy||DEFAULT_ASSIGNEES.daddy);
                    return(<div key={i} className={`wiz-day${i===7?" gap":""}`} style={{background:a.bg,color:a.fg}} title={c==="A"?A:B}>
                      <span>{["M","T","W","T","F","S","S"][i%7]}</span><b>{(c==="A"?A:B).slice(0,1)}</b>
                    </div>);
                  })}
                </div>
                <div className="wiz-options">
                  <label className="filter-check"><input type="checkbox" checked={school} onChange={e=>setSchool(e.target.checked)}/> School or daycare on weekdays (daytime &amp; lunch)</label>
                  <label className="filter-check"><input type="checkbox" checked={swap} onChange={e=>setSwap(e.target.checked)}/> {B} starts this week (instead of {A})</label>
                </div>
              </>
            )}
          </div>
        )}
        {step===4&&(
          <div className="wiz-body">
            <h2 className="wiz-title">🏖 School holidays</h2>
            <p className="wiz-text">Choose the school calendar your children follow. Holidays then show up as markers in the calendar, so you can plan who has the children when.</p>
            <select className="hol-select" style={{width:"100%"}} value={hol} onChange={e=>setHol(e.target.value)}>
              {Object.entries(HOLIDAY_CALENDARS).map(([k,v])=>(<option key={k} value={k}>{v.emoji} {v.label}</option>))}
            </select>
          </div>
        )}
        {step===5&&(
          <div className="wiz-body">
            <h2 className="wiz-title">💌 Invite your co-parent</h2>
            <p className="wiz-text">Send this code to your co-parent (and later to grandparents or the babysitter). They install the app, sign in and enter the code. <strong>Nobody sees anything until you approve them</strong> — you also choose whether they're a parent or a caregiver.</p>
            <div className="code-box" style={{justifyContent:"center"}}>
              <span className="code-big" style={{textAlign:"center"}}>{code||"…"}</span>
              <button className="btn btn-accent btn-xs" disabled={!code} onClick={()=>copyText(`Join “${calName}” in Together Apart: open ${location.origin} , sign in, choose “Join with a code” and enter ${code}`,()=>{setCopied(true);setTimeout(()=>setCopied(false),2000)})}>{copied?"Copied!":"Copy invite"}</button>
            </div>
            <p className="wiz-text" style={{marginTop:10,fontSize:".75rem"}}>You can find the code later under 🔐 Access &amp; sharing.</p>
          </div>
        )}
        {step===6&&(
          <div className="wiz-body">
            <div className="wiz-emoji">🎉</div>
            <h2 className="wiz-title">All set{kidNames.length?` for ${kidNames.join(" & ")}`:""}!</h2>
            <ul className="wiz-tips">
              <li><strong>Tap a block</strong> in the calendar to change who has the children on that day.</li>
              <li><strong>＋</strong> on a day adds an appointment (doctor, swimming, birthday party…).</li>
              <li><strong>Templates</strong> holds your two-week pattern{preset==="custom"?" — we'll open it now so you can fill it in":""}.</li>
              <li><strong>🔐 Access &amp; sharing</strong> is where you approve people and manage who sees what.</li>
            </ul>
          </div>
        )}
        <div className="wiz-actions">
          {step>0?<button className="btn btn-ghost" onClick={()=>setStep(s=>s-1)}>← Back</button>:<button className="btn btn-ghost" onClick={onLater}>Later</button>}
          <button className="btn btn-accent" onClick={next}>{step===0?"Let's start":step===STEPS.length-1?"Go to my schedule":"Next →"}</button>
        </div>
      </div>
    </div>
  );
}
/* ═══════════════════════════════════════════════
   ROLE TOUR (invited parents & caregivers; also via the ? button)
═══════════════════════════════════════════════ */
function RoleTour({role,calName,onClose}){
  const [i,setI]=useState(0);
  const common={
    read:{e:"🎨",t:"Reading the calendar",x:"Every day is split into blocks (morning, daytime, evening…). The colour shows who has the children. A dashed border means it comes from the regular two-week pattern; a solid colour means that day was changed."},
    appt:{e:"📌",t:"Appointments",x:"Tap ＋ on a day to add an appointment — doctor, swimming lesson, school party. Everyone with access sees it immediately."},
    feed:{e:"📲",t:"In your own calendar app",x:"Under 🔐 Access & sharing you'll find your personal link to show this schedule in Google, Outlook or Apple Calendar. It's private: don't share it."},
  };
  const slides=role==="caregiver"?[
    {e:"👋",t:`Welcome to “${calName}”`,x:"You've been added as a caregiver. You can see when the children are with whom, and add appointments. The parents take care of the custody schedule itself."},
    common.read,common.appt,common.feed,
    {e:"💬",t:"Something not right?",x:"If a day looks wrong, let one of the parents know — they can change it. Only the owner of the schedule decides who has access."},
  ]:role==="parent"?[
    {e:"👋",t:`Welcome to “${calName}”`,x:"You've been added as a parent. You can see and change everything in the schedule. The owner manages who has access."},
    common.read,
    {e:"✏️",t:"Changing a day",x:"Tap a block to choose who has the children — handy for a swap or a holiday. Tap ＋ / ✏️ inside a block to add a note, like “pick-up at 17:30”."},
    common.appt,
    {e:"🗂",t:"The regular pattern",x:"The Templates tab holds the repeating two-week arrangement. Changing it affects all future days that weren't changed by hand."},
    common.feed,
  ]:[
    {e:"🤝",t:"Quick tour",x:"You're the owner of this schedule: you decide who can see it and what they can do."},
    common.read,
    {e:"✏️",t:"Changing a day",x:"Tap a block to choose who has the children. Tap ＋ / ✏️ inside a block to add a note."},
    common.appt,
    {e:"🔐",t:"Access & sharing",x:"Share your join code, approve requests, choose Parent or Caregiver, and remove people at any time. A new code makes the old one stop working."},
  ];
  const s=slides[i];const last=i===slides.length-1;
  return(
    <div className="wiz-backdrop">
      <div className="wiz-card tour-card" role="dialog" aria-label="How to use the app">
        <div className="wiz-progress">{slides.map((_,k)=>(<div key={k} className={`wiz-dot${k<=i?" on":""}`}/>))}</div>
        <div className="wiz-body" style={{textAlign:"center"}}>
          <div className="wiz-emoji">{s.e}</div>
          <h2 className="wiz-title">{s.t}</h2>
          <p className="wiz-text">{s.x}</p>
        </div>
        <div className="wiz-actions">
          {i>0?<button className="btn btn-ghost" onClick={()=>setI(i-1)}>← Back</button>:<button className="btn btn-ghost" onClick={onClose}>Skip</button>}
          <button className="btn btn-accent" onClick={()=>last?onClose():setI(i+1)}>{last?"Got it":"Next →"}</button>
        </div>
      </div>
    </div>
  );
}
/* ═══════════════════════════════════════════════
   CHILDREN EDITOR (People tab)
═══════════════════════════════════════════════ */
function ChildrenEditor({settings,setSettings,notify}){
  const kids=settings.children||[];
  const [name,setName]=useState("");
  const [year,setYear]=useState("");
  function setKids(fn){setSettings(s=>({...s,children:fn(s.children||[])}))}
  function add(){if(!name.trim())return;setKids(p=>[...p,{id:"c_"+Date.now(),name:name.trim(),birthYear:year}]);setName("");setYear("")}
  function remove(k){const before=kids;setKids(p=>p.filter(x=>x.id!==k.id));notify(`“${k.name}” removed`,()=>setSettings(s=>({...s,children:before})))}
  return(
    <div className="card" style={{marginBottom:14}}>
      <div className="section-head"><div className="section-title">Children</div><div className="section-sub">Shown at the top of the schedule for everyone with access.</div></div>
      <div className="section-body">
        {kids.map(k=>(
          <div key={k.id} className="tbl-row">
            <span style={{fontSize:"1.1rem"}}>🧒</span>
            <input className="tbl-label-input" value={k.name} onChange={e=>setKids(p=>p.map(x=>x.id===k.id?{...x,name:e.target.value}:x))}/>
            <input className="tbl-label-input" style={{maxWidth:80,flex:"none"}} placeholder="Year" value={k.birthYear||""}
              onChange={e=>setKids(p=>p.map(x=>x.id===k.id?{...x,birthYear:e.target.value.replace(/\D/g,"").slice(0,4)}:x))}/>
            <button className="btn btn-danger btn-xs" title="Remove" onClick={()=>remove(k)}>✕</button>
          </div>
        ))}
        <div className="tbl-add-row">
          <span style={{fontSize:"1.1rem"}}>🧒</span>
          <input className="tbl-label-input" placeholder="Child's name…" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/>
          <input className="tbl-label-input" style={{maxWidth:80,flex:"none",minWidth:0}} placeholder="Year" value={year} onChange={e=>setYear(e.target.value.replace(/\D/g,"").slice(0,4))}/>
          <button className="btn btn-accent btn-xs" onClick={add}>Add</button>
        </div>
      </div>
    </div>
  );
}

const ROLE_LABEL={owner:"Owner",parent:"Parent",caregiver:"Caregiver"};
function friendlyError(e){
  const m=String(e&&e.message||e||"");
  if(/rate limit|too many/i.test(m))return"Too many requests — please wait a few minutes and try again.";
  if(/fetch|network|load failed|timeout/i.test(m)||!navigator.onLine)return"Can't reach the server right now. Check your connection and try again.";
  if(/invalid code/i.test(m))return"That code doesn't match any schedule. Check it with the person who shared it.";
  if(/expired|invalid/i.test(m))return"That code isn't right or has expired — request a new email.";
  return m||"Something went wrong.";
}
function copyText(t,done){
  try{navigator.clipboard.writeText(t).then(done,()=>{})}catch{}
}
/* ═══════════════════════════════════════════════
   SIGN-IN VIEW  (email link, with 6-digit code as backup)
═══════════════════════════════════════════════ */
function SignInView(){
  if(DEMO)return <DemoSignIn/>;
  const [email,setEmail]=useState("");
  const [code,setCode]=useState("");
  const [stage,setStage]=useState("email");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  async function sendLink(e){
    e&&e.preventDefault();
    if(!email.trim()||busy)return;
    setBusy(true);setErr("");
    try{
      const{error}=await sbClient.auth.signInWithOtp({
        email:email.trim().toLowerCase(),
        options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname}
      });
      if(error)throw error;
      setStage("sent");
    }catch(e){setErr(friendlyError(e))}
    finally{setBusy(false)}
  }
  async function verify(e){
    e.preventDefault();
    if(!code.trim()||busy)return;
    setBusy(true);setErr("");
    try{
      const{error}=await sbClient.auth.verifyOtp({email:email.trim().toLowerCase(),token:code.replace(/\s/g,""),type:"email"});
      if(error)throw error;
    }catch(e){setErr(friendlyError(e))}
    finally{setBusy(false)}
  }
  return(
    <div className="auth-wrap">
      <div className="auth-card">
        <div style={{fontSize:"2rem",marginBottom:8}}>🤝</div>
        <div className="auth-title">Together Apart</div>
        {stage==="email"?(
          <>
            <div className="auth-sub">Sign in or create an account with your email. Your schedule is only visible to the people you allow.</div>
            <form onSubmit={sendLink}>
              <input className="auth-input" type="email" autoComplete="email" placeholder="you@example.com" value={email} onChange={e=>setEmail(e.target.value)} autoFocus/>
              <button className="btn btn-accent" style={{width:"100%",justifyContent:"center"}} disabled={busy}>{busy?"Sending…":"Email me a sign-in link"}</button>
            </form>
          </>
        ):(
          <>
            <div className="auth-sub">📬 We sent an email to <strong>{email}</strong>.<br/>Tap the link in it <strong>on this device</strong> to sign in.</div>
            <form onSubmit={verify} style={{marginTop:6}}>
              <div className="auth-note" style={{marginTop:0,marginBottom:8}}>Opened the email somewhere else? Enter the 6-digit code from the email instead:</div>
              <input className="auth-input" inputMode="numeric" autoComplete="one-time-code" placeholder="123456" value={code} onChange={e=>setCode(e.target.value)}/>
              <button className="btn btn-accent" style={{width:"100%",justifyContent:"center"}} disabled={busy||!code.trim()}>{busy?"Checking…":"Sign in with code"}</button>
            </form>
            <div style={{display:"flex",gap:8,justifyContent:"center",marginTop:10,flexWrap:"wrap"}}>
              <button type="button" className="btn btn-ghost btn-xs" onClick={sendLink} disabled={busy}>Send again</button>
              <button type="button" className="btn btn-ghost btn-xs" onClick={()=>{setStage("email");setCode("");setErr("")}}>Use a different email</button>
            </div>
          </>
        )}
        {err&&<div className="auth-err">{err}</div>}
        <div className="auth-note">No password needed — we email you a sign-in link each time.</div>
        <div className="auth-or"><span>or</span></div>
        <button type="button" className="btn btn-ghost" style={{width:"100%",justifyContent:"center"}} onClick={()=>{location.href=location.pathname+"?demo"}}>🧪 Try it without an account (demo)</button>
        <div className="auth-note" style={{marginTop:6}}>The demo keeps everything on this device. Nothing is shared.</div>
      </div>
    </div>
  );
}
/* ═══════════════════════════════════════════════
   ONBOARDING: create a schedule or join with a code
═══════════════════════════════════════════════ */
function OnboardingView({session,pending,hasLocalData,onCreate,onJoin,onCancelRequest,onRefresh,onBack}){
  const [name,setName]=useState("");
  const [useLocal,setUseLocal]=useState(hasLocalData);
  const [code,setCode]=useState("");
  const [myName,setMyName]=useState("");
  const [busy,setBusy]=useState("");
  const [err,setErr]=useState("");
  const [msg,setMsg]=useState("");
  function fmtCode(v){
    const c=v.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
    return c.length>4?c.slice(0,4)+"-"+c.slice(4):c;
  }
  async function create(e){
    e.preventDefault();if(!name.trim()||busy)return;
    setBusy("create");setErr("");
    try{await onCreate(name.trim(),useLocal)}catch(e){setErr(friendlyError(e))}finally{setBusy("")}
  }
  async function join(e){
    e.preventDefault();if(code.replace("-","").length!==8||busy)return;
    setBusy("join");setErr("");setMsg("");
    try{
      const r=await onJoin(code,myName.trim());
      setCode("");
      setMsg(r&&r.status==="active"?`You already have access to “${r.calendar_name}”.`:`Request sent for “${r?r.calendar_name:"the schedule"}”. You'll get access as soon as the owner approves.`);
    }catch(e){setErr(friendlyError(e))}finally{setBusy("")}
  }
  return(
    <div className="onb-wrap">
      <div className="onb-head">
        <div style={{fontSize:"1.8rem"}}>🤝</div>
        <div className="auth-title">Welcome to Together Apart</div>
        <div className="auth-sub" style={{marginBottom:0}}>Signed in as <strong>{session.user.email}</strong></div>
      </div>
      {pending.length>0&&(
        <div className="onb-card">
          <div className="share-title">⏳ Waiting for approval</div>
          {pending.map(p=>(
            <div key={p.calendar_id} className="member-row" style={{alignItems:"center"}}>
              <span>{p.name||"A schedule"} — the owner still needs to approve you.</span>
              <button className="btn btn-ghost btn-xs" onClick={()=>onCancelRequest(p.calendar_id)}>Cancel</button>
            </div>
          ))}
          <button className="btn btn-ghost btn-xs" style={{marginTop:8}} onClick={onRefresh}>↻ Check again</button>
        </div>
      )}
      <div className="onb-grid">
        <form className="onb-card" onSubmit={create}>
          <div className="share-title">✨ Start a new schedule</div>
          <div className="share-sub">You'll be the owner: you decide who can see it and what they can do.</div>
          <input className="auth-input" style={{textAlign:"left"}} placeholder="e.g. Noah & Lina's schedule" value={name} onChange={e=>setName(e.target.value)} maxLength={80}/>
          {hasLocalData&&(
            <label className="filter-check" style={{marginBottom:10,width:"100%"}}>
              <input type="checkbox" checked={useLocal} onChange={e=>setUseLocal(e.target.checked)}/>
              Start from the schedule already on this device
            </label>
          )}
          <button className="btn btn-accent" style={{width:"100%",justifyContent:"center"}} disabled={!!busy||!name.trim()}>{busy==="create"?"Creating…":"Create schedule"}</button>
        </form>
        <form className="onb-card" onSubmit={join}>
          <div className="share-title">🔑 Join with a code</div>
          <div className="share-sub">Got a code from a parent? Enter it here. The owner approves you before you see anything.</div>
          <input className="auth-input code-input" placeholder="XXXX-XXXX" value={code} onChange={e=>setCode(fmtCode(e.target.value))} autoCapitalize="characters" autoComplete="off" spellCheck={false}/>
          <input className="auth-input" style={{textAlign:"left"}} placeholder="Your name (shown to the owner)" value={myName} onChange={e=>setMyName(e.target.value)} maxLength={60}/>
          <button className="btn btn-accent" style={{width:"100%",justifyContent:"center"}} disabled={!!busy||code.replace("-","").length!==8}>{busy==="join"?"Sending…":"Request access"}</button>
          {msg&&<div className="onb-msg">{msg}</div>}
        </form>
      </div>
      {err&&<div className="auth-err" style={{textAlign:"center"}}>{err}</div>}
      <div style={{textAlign:"center",marginTop:16,display:"flex",gap:8,justifyContent:"center"}}>
        {onBack&&<button className="btn btn-ghost btn-xs" onClick={onBack}>← Back to my schedule</button>}
        <button className="btn btn-ghost btn-xs" onClick={()=>sbClient.auth.signOut()}>Sign out</button>
      </div>
    </div>
  );
}
/* ═══════════════════════════════════════════════

function MembersView({cal,role,session,assignees,syncStatus,lastSync,members,onReloadMembers,onLeft,onRenamed,onExport,onImport,canEdit,notify,onOpenWizard}){
  const isOwner=role==="owner";
  const [joinCode,setJoinCode]=useState("");
  const [copied,setCopied]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const [approveRole,setApproveRole]=useState({});
  const [feedToken,setFeedToken]=useState(null);
  const [nameDraft,setNameDraft]=useState(cal.name);
  const fileRef=useRef(null);
  const [selected,setSelected]=useState(()=>{
    const saved=loadLS("ta_share_filter",null);
    if(saved)return saved;
    const def={appointments:true};
    Object.values(assignees).filter(a=>a.id!=="none").forEach(a=>{def[a.id]=true});
    return def;
  });
  useEffect(()=>saveLS("ta_share_filter",selected),[selected]);
  useEffect(()=>{setNameDraft(cal.name)},[cal.name]);
  useEffect(()=>{
    let off=false;
    if(isOwner)sbClient.rpc("get_join_code",{p_cal:cal.id}).then(({data})=>{if(!off&&data)setJoinCode(data)});
    sbClient.rpc("my_feed_token",{p_cal:cal.id}).then(({data})=>{if(!off)setFeedToken(data||null)});
    return()=>{off=true};
  },[cal.id,isOwner]);
  function flash(k){setCopied(k);setTimeout(()=>setCopied(""),2000)}
  async function run(fn,okMsg){
    setBusy(true);setErr("");
    try{const{error}=await fn();if(error)throw error;if(okMsg)notify(okMsg);await onReloadMembers();}
    catch(e){setErr(friendlyError(e))}
    finally{setBusy(false)}
  }
  async function newCode(){
    if(!confirm("Create a new code? The current code stops working immediately. People who already have access keep it."))return;
    setBusy(true);setErr("");
    try{const{data,error}=await sbClient.rpc("regenerate_join_code",{p_cal:cal.id});if(error)throw error;setJoinCode(data);notify("New code created — the old one no longer works")}
    catch(e){setErr(friendlyError(e))}finally{setBusy(false)}
  }
  async function shareCode(){
    const text=`Join our schedule “${cal.name}” in Together Apart: open ${location.origin} , sign in, choose “Join with a code” and enter ${joinCode}`;
    if(navigator.share){try{await navigator.share({title:"Together Apart",text});return}catch{}}
    copyText(text,()=>flash("msg"));
  }
  async function rename(){
    if(!nameDraft.trim()||nameDraft.trim()===cal.name)return;
    await run(()=>sbClient.rpc("rename_calendar",{p_cal:cal.id,p_name:nameDraft.trim()}),"Schedule renamed");
    onRenamed();
  }
  async function leave(){
    if(!confirm(`Leave “${cal.name}”? You'll lose access until the owner approves you again.`))return;
    setBusy(true);
    try{const{error}=await sbClient.rpc("leave_calendar",{p_cal:cal.id});if(error)throw error;onLeft()}
    catch(e){setErr(friendlyError(e))}finally{setBusy(false)}
  }
  const pending=members.filter(m=>m.status==="pending");
  const active=members.filter(m=>m.status==="active");
  const me=session.user.id;
  const includeParam=Object.entries(selected).filter(([,v])=>v).map(([k])=>k).join(",");
  const webcalUrl=feedToken&&includeParam
    ?`webcal://niujbgjfumehoswcodpw.supabase.co/functions/v1/ics-feed?token=${feedToken}&include=${includeParam}&months=6`:"";
  const who=m=>m.display_name?`${m.display_name} (${m.email})`:m.email;
  return(
    <div className="share-card">
      <div className="share-section">
        <div className="share-title">☁️ Sync</div>
        <span className={`sync-status ${syncStatus}`}>
          {syncStatus==="ok"?"✅ Synced":syncStatus==="pending"?"⏳ Syncing…":syncStatus==="offline"?"📴 Offline — will sync when back online":"❌ Sync error — retrying"}
        </span>
        {lastSync&&<span style={{marginLeft:8,fontSize:".68rem",color:"var(--text-muted)"}}>Last synced {new Date(lastSync).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</span>}
        <div className="share-sub" style={{marginTop:8,marginBottom:0}}>Only the people listed below can see this schedule. You are <strong>{ROLE_LABEL[role]}</strong>.</div>
      </div>
      {isOwner&&(
        <div className="share-section">
          <div className="share-title">🏷 Schedule name</div>
          <div style={{display:"flex",gap:8}}>
            <input className="tbl-label-input" style={{borderColor:"var(--border)"}} value={nameDraft} onChange={e=>setNameDraft(e.target.value)} maxLength={80}/>
            <button className="btn btn-ghost btn-xs" disabled={busy||nameDraft.trim()===cal.name} onClick={rename}>Save</button>
          </div>
          <button className="btn btn-ghost btn-xs" style={{marginTop:10}} onClick={onOpenWizard}>🪄 Run the setup assistant again</button>
        </div>
      )}
      {isOwner&&(
        <div className="share-section">
          <div className="share-title">🔑 Join code</div>
          <div className="share-sub">Share this code with your co-parent or caregivers. Entering it only sends <em>you</em> a request — nobody sees anything until you approve them.</div>
          <div className="code-box">
            <span className="code-big">{joinCode||"…"}</span>
            <button className="btn btn-accent btn-xs" disabled={!joinCode} onClick={shareCode}>{copied==="msg"?"Copied!":"Share"}</button>
            <button className="btn btn-ghost btn-xs" disabled={!joinCode} onClick={()=>copyText(joinCode,()=>flash("code"))}>{copied==="code"?"Copied!":"Copy code"}</button>
            <button className="btn btn-ghost btn-xs" disabled={busy} onClick={newCode}>New code</button>
          </div>
        </div>
      )}
      {isOwner&&pending.length>0&&(
        <div className="share-section">
          <div className="share-title">🙋 Requests to join ({pending.length})</div>
          {pending.map(m=>(
            <div key={m.user_id} className="req-row">
              <div style={{flex:1,minWidth:160}}>
                <div style={{fontWeight:500}}>{m.display_name||m.email}</div>
                {m.display_name&&<div style={{fontSize:".7rem",color:"var(--text-muted)"}}>{m.email}</div>}
              </div>
              <select className="role-select" value={approveRole[m.user_id]||"caregiver"} onChange={e=>setApproveRole(p=>({...p,[m.user_id]:e.target.value}))}>
                <option value="parent">Parent — can edit everything</option>
                <option value="caregiver">Caregiver — view + appointments</option>
              </select>
              <button className="btn btn-accent btn-xs" disabled={busy} onClick={()=>run(()=>sbClient.rpc("approve_member",{p_cal:cal.id,p_user:m.user_id,p_role:approveRole[m.user_id]||"caregiver"}),"Access approved")}>Approve</button>
              <button className="btn btn-ghost btn-xs" disabled={busy} onClick={()=>run(()=>sbClient.rpc("remove_member",{p_cal:cal.id,p_user:m.user_id}),"Request declined")}>Decline</button>
            </div>
          ))}
        </div>
      )}
      <div className="share-section">
        <div className="share-title">👥 People with access</div>
        {active.map(m=>(
          <div key={m.user_id} className="req-row">
            <div style={{flex:1,minWidth:160}}>
              <div style={{fontWeight:500}}>{m.display_name||m.email}{m.user_id===me?" (you)":""}</div>
              {m.display_name&&<div style={{fontSize:".7rem",color:"var(--text-muted)"}}>{m.email}</div>}
            </div>
            {isOwner&&m.user_id!==me?(
              <>
                <select className="role-select" value={m.role} disabled={busy}
                  onChange={e=>run(()=>sbClient.rpc("set_member_role",{p_cal:cal.id,p_user:m.user_id,p_role:e.target.value}),"Role updated")}>
                  <option value="parent">Parent</option>
                  <option value="caregiver">Caregiver</option>
                </select>
                <button className="btn btn-ghost btn-xs" disabled={busy} title="Make this person the owner"
                  onClick={()=>{if(confirm(`Make ${who(m)} the owner? You'll become a parent and can no longer manage access.`))run(()=>sbClient.rpc("transfer_ownership",{p_cal:cal.id,p_user:m.user_id}),"Ownership transferred")}}>Make owner</button>
                <button className="btn btn-danger btn-xs" disabled={busy}
                  onClick={()=>{if(confirm(`Remove ${who(m)}? They lose access immediately, including their calendar subscription.`))run(()=>sbClient.rpc("remove_member",{p_cal:cal.id,p_user:m.user_id}),"Access removed")}}>Remove</button>
              </>
            ):(
              <span className={`role-badge ${m.role}`}>{ROLE_LABEL[m.role]}</span>
            )}
          </div>
        ))}
        {!isOwner&&<button className="btn btn-ghost btn-xs" style={{marginTop:10}} disabled={busy} onClick={leave}>Leave this schedule</button>}
        {err&&<div className="auth-err">{err}</div>}
      </div>
      <div className="share-section">
        <div className="share-title">📅 Subscribe in your calendar app</div>
        <div className="share-sub">Your personal, private link. Don't share it — it stops working if you're removed from the schedule.{DEMO?" (Demo: this link doesn't work, because demo data never leaves your device.)":""}</div>
        <div className="filter-checks">
          {Object.values(assignees).filter(a=>a.id!=="none").map(a=>(
            <label key={a.id} className="filter-check" style={{borderColor:selected[a.id]?a.fg:"var(--border)"}}>
              <input type="checkbox" checked={!!selected[a.id]} onChange={()=>setSelected(p=>({...p,[a.id]:!p[a.id]}))}/>
              <span style={{color:a.fg}}>{a.label}</span>
            </label>
          ))}
          <label className="filter-check" style={{borderColor:selected.appointments?"var(--accent)":"var(--border)"}}>
            <input type="checkbox" checked={!!selected.appointments} onChange={()=>setSelected(p=>({...p,appointments:!p.appointments}))}/>
            📌 Appointments
          </label>
        </div>
        {webcalUrl&&(
          <>
            <div className="webcal-box">
              <div className="webcal-url">{webcalUrl}</div>
              <button className="btn btn-accent btn-xs" onClick={()=>copyText(webcalUrl,()=>flash("feed"))}>{copied==="feed"?"Copied!":"Copy"}</button>
            </div>
            <div className="cal-instructions">
              <strong>Outlook:</strong> Add calendar → From internet → paste URL<br/>
              <strong>Google:</strong> Other calendars → From URL → paste URL<br/>
              <strong>Apple:</strong> File → New Calendar Subscription → paste URL
            </div>
          </>
        )}
      </div>
      <div className="share-section">
        <div className="share-title">💾 Backup</div>
        <div className="share-sub">Download a copy of this schedule{canEdit?", or restore one from a file":""}.</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button className="btn btn-accent btn-xs" onClick={onExport}>⬇ Export backup</button>
          {canEdit&&<button className="btn btn-ghost btn-xs" onClick={()=>fileRef.current&&fileRef.current.click()}>⬆ Restore from file</button>}
          <input ref={fileRef} type="file" accept="application/json,.json" style={{display:"none"}}
            onChange={e=>{const f=e.target.files[0];if(f)onImport(f);e.target.value="";}}/>
        </div>
      </div>
      <div className="share-section">
        <div className="share-title">👤 Account</div>
        <div className="share-sub">Signed in as <strong>{session.user.email}</strong></div>
        <button className="btn btn-ghost btn-xs" onClick={()=>sbClient.auth.signOut()}>Sign out</button>
      </div>
    </div>
  );
}
/* ═══════════════════════════════════════════════
   APP

function defaultAnchor(){
  const d=new Date();const dow=d.getDay();
  d.setDate(d.getDate()-(dow===0?6:dow-1));
  return d.toISOString().slice(0,10);
}
function App(){
  const today=new Date();
  const [tab,setTab]=useState("today");
  const [setupTab,setSetupTab]=useState("template");
  const [openDay,setOpenDay]=useState(null);
  const [year,setYear]=useState(today.getFullYear());
  const [month,setMonth]=useState(today.getMonth());
  const [timeBlocks,setTimeBlocks]=useState(()=>loadLS("ta_blocks",DEFAULT_BLOCKS));
  const [assignees,setAssignees]=useState(()=>upgradeAssignees(loadLS("ta_assignees",DEFAULT_ASSIGNEES)));
  const [templates,setTemplates]=useState(()=>loadLS("ta_templates2",null));
  const [overrides,setOverrides]=useState(()=>loadLS("ta_overrides2",{}));
  const [anchorDate,setAnchorDate]=useState(()=>loadLS("ta_anchor",defaultAnchor()));
  const [holidayCalKey,setHolidayCalKey]=useState(()=>loadLS("ta_holidayCal","none"));
  const [appointments,setAppointments]=useState(()=>loadLS("ta_appointments",{}));
  const [settings,setSettings]=useState(()=>loadLS("ta_settings",{}));
  const [showWizard,setShowWizard]=useState(false);
  const [showTour,setShowTour]=useState(false);
  const holidayRef=useRef(holidayCalKey);holidayRef.current=holidayCalKey;
  // Auth + memberships
  const [session,setSession]=useState(undefined); // undefined = loading, null = signed out
  const [memberships,setMemberships]=useState(null); // null = loading
  const [activeCalId,setActiveCalId]=useState(()=>loadLS("ta_active_cal",null));
  const [showOnboarding,setShowOnboarding]=useState(false);
  const [members,setMembers]=useState([]);
  // Sync
  const [syncStatus,setSyncStatus]=useState("pending");
  const [remoteReady,setRemoteReady]=useState(false);
  const [lastSync,setLastSync]=useState(null);
  const [retryTick,setRetryTick]=useState(0);
  const lastRemoteRef=useRef(null);
  const retryTimer=useRef(null);
  const initRef=useRef(null); // {cal, useLocal} right after creating a schedule
  const [toast,setToast]=useState(null);
  const toastTimer=useRef(null);
  function notify(msg,undo){
    clearTimeout(toastTimer.current);
    setToast({msg,undo});
    toastTimer.current=setTimeout(()=>setToast(null),7000);
  }
  const hasLocalData=useMemo(()=>{
    const ov=loadLS("ta_overrides2",{}),ap=loadLS("ta_appointments",{}),tp=loadLS("ta_templates2",null);
    const tplUsed=!!tp&&Object.values(tp).some(w=>Object.values(w||{}).some(d=>Object.values(d||{}).some(v=>v&&v!=="none")));
    return Object.keys(ov).length>0||Object.keys(ap).length>0||!!tplUsed;
  },[]);
  const activeList=(memberships||[]).filter(m=>m.status==="active");
  const pendingList=(memberships||[]).filter(m=>m.status==="pending");
  const active=activeList.find(m=>m.calendar_id===activeCalId)||activeList[0]||null;
  const calId=active?active.calendar_id:null;
  const role=active?active.role:null;
  const canEdit=role==="owner"||role==="parent";
  const safeTemplates=useMemo(()=>{
    if(!templates)return emptyTemplates(timeBlocks);
    const t=JSON.parse(JSON.stringify(templates));
    ["week1","week2"].forEach(wk=>{
      if(!t[wk])t[wk]=emptyWeekTpl(timeBlocks);
      for(let d=0;d<7;d++){
        if(!t[wk][d])t[wk][d]={};
        timeBlocks.forEach(b=>{if(t[wk][d][b.id]==null)t[wk][d][b.id]="none"});
      }
    });
    return t;
  },[templates,timeBlocks]);
  function snap(o,ap,as,tb,wt,ad,se){return JSON.stringify([o,ap,as,tb,wt,ad,se])}
  const settingsOut=useMemo(()=>({...settings,holidayCal:holidayCalKey}),[settings,holidayCalKey]);
  function nonEmptyObj(o){return o&&typeof o==="object"&&Object.keys(o).length>0}
  function applyRemote(row){
    const ov=row.overrides||{};
    const ap=row.appointments||{};
    const as=upgradeAssignees(nonEmptyObj(row.assignees)?row.assignees:DEFAULT_ASSIGNEES);
    const tb=Array.isArray(row.time_blocks)&&row.time_blocks.length?row.time_blocks:DEFAULT_BLOCKS;
    const wt=nonEmptyObj(row.week_template)?row.week_template:null;
    const ad=row.anchor_date||defaultAnchor();
    // safeTemplates will be derived from wt; compute the same value for the echo check
    let st=wt?JSON.parse(JSON.stringify(wt)):emptyTemplates(tb);
    ["week1","week2"].forEach(wk=>{
      if(!st[wk])st[wk]=emptyWeekTpl(tb);
      for(let d=0;d<7;d++){if(!st[wk][d])st[wk][d]={};tb.forEach(b=>{if(st[wk][d][b.id]==null)st[wk][d][b.id]="none"})}
    });
    const rs=nonEmptyObj(row.settings)?row.settings:{};
    const hc=rs.holidayCal||holidayRef.current||"none";
    const se={...rs,holidayCal:hc};
    lastRemoteRef.current=snap(ov,ap,as,tb,st,ad,se);
    setOverrides(ov);setAppointments(ap);setAssignees(as);setTimeBlocks(tb);setTemplates(wt);setAnchorDate(ad);
    setSettings(rs);setHolidayCalKey(hc);
    if(row.updated_at)setLastSync(row.updated_at);
    setSyncStatus("ok");
  }
  // Persist the open schedule to this device (offline cache)
  useEffect(()=>saveLS("ta_blocks",timeBlocks),[timeBlocks]);
  useEffect(()=>saveLS("ta_assignees",assignees),[assignees]);
  useEffect(()=>saveLS("ta_templates2",safeTemplates),[safeTemplates]);
  useEffect(()=>saveLS("ta_overrides2",overrides),[overrides]);
  useEffect(()=>saveLS("ta_anchor",anchorDate),[anchorDate]);
  useEffect(()=>saveLS("ta_holidayCal",holidayCalKey),[holidayCalKey]);
  useEffect(()=>saveLS("ta_appointments",appointments),[appointments]);
  useEffect(()=>saveLS("ta_settings",settings),[settings]);
  useEffect(()=>{if(calId)saveLS("ta_active_cal",calId)},[calId]);
  // Auth session + online detection
  useEffect(()=>{
    sbClient.auth.getSession().then(({data})=>setSession(data.session??null));
    const{data:sub}=sbClient.auth.onAuthStateChange((_e,s)=>setSession(s));
    const onOnline=()=>setRetryTick(t=>t+1);
    window.addEventListener("online",onOnline);
    return()=>{sub.subscription.unsubscribe();window.removeEventListener("online",onOnline);};
  },[]);
  // Load my memberships (which schedules I may see)
  async function loadMemberships(){
    const uid=(await sbClient.auth.getUser()).data.user?.id;
    if(!uid){setMemberships([]);return;}
    const{data,error}=await sbClient.from("calendar_members")
      .select("calendar_id,role,status,joined_at,calendars(name)").eq("user_id",uid).order("joined_at");
    if(error){setMemberships(m=>m||[]);setSyncStatus(navigator.onLine?"error":"offline");return;}
    const pendingNames=loadLS("ta_pending_names",{});
    setMemberships((data||[]).map(r=>({calendar_id:r.calendar_id,role:r.role,status:r.status,
      name:r.calendars?r.calendars.name:(pendingNames[r.calendar_id]||null)})));
  }
  useEffect(()=>{
    if(!session){setMemberships(null);return;}
    if(location.hash.includes("access_token"))history.replaceState(null,"",location.pathname);
    loadMemberships();
    // Approval / removal / role change for me arrives live
    const ch=sbClient.channel("me-"+session.user.id)
      .on("postgres_changes",{event:"*",schema:"public",table:"calendar_members",filter:"user_id=eq."+session.user.id},()=>loadMemberships())
      .subscribe();
    return()=>{sbClient.removeChannel(ch)};
  },[session?.user?.id]);
  // Members of the open schedule
  async function loadMembers(){
    if(!calId)return;
    const{data}=await sbClient.from("calendar_members")
      .select("user_id,email,display_name,role,status,joined_at").eq("calendar_id",calId).order("joined_at");
    if(data)setMembers(data);
  }
  // Open a schedule: pull its data and subscribe to live changes
  useEffect(()=>{
    setRemoteReady(false);setMembers([]);
    if(!session||!calId)return;
    let cancelled=false;
    (async()=>{
      try{
        const init=initRef.current&&initRef.current.cal===calId?initRef.current:null;
        if(init){
          initRef.current=null;
          if(!init.useLocal){
            setOverrides({});setAppointments({});setAssignees(DEFAULT_ASSIGNEES);setTimeBlocks(DEFAULT_BLOCKS);setTemplates(null);setAnchorDate(defaultAnchor());setSettings({});
          }
          lastRemoteRef.current=null; // force first push of this schedule's content
          saveLS("ta_cache_cal",calId);saveLS("ta_dirty",false);
        }else{
          const{data,error}=await sbClient.from("calendar_data").select("*").eq("calendar_id",calId).maybeSingle();
          if(cancelled)return;
          if(error)throw error;
          const localIsThis=loadLS("ta_cache_cal",null)===calId;
          if(localIsThis&&loadLS("ta_dirty",false)){
            lastRemoteRef.current=null; // unsynced offline edits on this device: push them
          }else if(data){
            applyRemote(data);
          }
          saveLS("ta_cache_cal",calId);
        }
        if(!cancelled)setRemoteReady(true);
        loadMembers();
      }catch{
        if(!cancelled)setSyncStatus(navigator.onLine?"error":"offline");
      }
    })();
    const ch=sbClient.channel("cal-"+calId)
      .on("postgres_changes",{event:"*",schema:"public",table:"calendar_data",filter:"calendar_id=eq."+calId},
        p=>{if(p.new&&p.new.device_id!==DEVICE_ID)applyRemote(p.new)})
      .on("postgres_changes",{event:"*",schema:"public",table:"calendar_members",filter:"calendar_id=eq."+calId},()=>loadMembers())
      .subscribe();
    return()=>{cancelled=true;sbClient.removeChannel(ch);};
  },[session?.user?.id,calId]);
  // Push local changes (debounced 2s, retries when offline).
  // Caregivers only send appointments; the database refuses anything else from them.
  const syncTimer=useRef(null);
  useEffect(()=>{
    if(!session||!remoteReady||!calId)return;
    const current=snap(overrides,appointments,assignees,timeBlocks,safeTemplates,anchorDate,settingsOut);
    if(current===lastRemoteRef.current)return;
    if(!canEdit&&lastRemoteRef.current){
      // caregivers: only appointments are ever sent, so ignore local-only differences elsewhere
      try{const prev=JSON.parse(lastRemoteRef.current);if(JSON.stringify(prev[1])===JSON.stringify(appointments))return;}catch{}
    }
    saveLS("ta_dirty",true);
    setSyncStatus("pending");
    clearTimeout(syncTimer.current);
    syncTimer.current=setTimeout(async()=>{
      const now=new Date().toISOString();
      try{
        const base={updated_at:now,updated_by:session.user.email,device_id:DEVICE_ID};
        const payload=canEdit
          ?{...base,overrides,appointments,assignees,time_blocks:timeBlocks,week_template:safeTemplates,anchor_date:anchorDate,settings:settingsOut}
          :{...base,appointments};
        const{data,error}=await sbClient.from("calendar_data").update(payload).eq("calendar_id",calId).select("calendar_id");
        if(error)throw error;
        if(!data||!data.length){loadMemberships();throw new Error("no access");}
        lastRemoteRef.current=current;
        saveLS("ta_dirty",false);setLastSync(now);setSyncStatus("ok");
      }catch{
        setSyncStatus(navigator.onLine?"error":"offline");
        clearTimeout(retryTimer.current);
        retryTimer.current=setTimeout(()=>setRetryTick(t=>t+1),30000);
      }
    },2000);
    return()=>clearTimeout(syncTimer.current);
  },[overrides,appointments,assignees,timeBlocks,safeTemplates,anchorDate,settingsOut,session,remoteReady,calId,canEdit,retryTick]);
  // First-time guidance: setup wizard for a new owner, role tour for invited people
  useEffect(()=>{
    if(!remoteReady||!calId||!role)return;
    if(role==="owner"){
      if(!settings.onboarded&&!loadLS("ta_wiz_later_"+calId,false))setShowWizard(true);
    }else if(!loadLS("ta_tour_"+calId,false))setShowTour(true);
  },[remoteReady,calId,role]);
  // Create / join / switch
  async function createSchedule(name,useLocal){
    const{data,error}=await sbClient.rpc("create_calendar",{p_name:name});
    if(error)throw error;
    initRef.current={cal:data,useLocal};
    await loadMemberships();
    setActiveCalId(data);setShowOnboarding(false);setTab("today");
    notify(useLocal?"Schedule created from this device":"Schedule created — start by setting up your fortnight template");
  }
  async function joinSchedule(code,displayName){
    const{data,error}=await sbClient.rpc("request_join",{p_code:code,p_display_name:displayName||null});
    if(error)throw error;
    const r=data&&data[0];
    if(r)saveLS("ta_pending_names",{...loadLS("ta_pending_names",{}),[r.calendar_id]:r.calendar_name});
    await loadMemberships();
    return r;
  }
  async function cancelRequest(cal){
    await sbClient.rpc("leave_calendar",{p_cal:cal});
    loadMemberships();
  }
  // Backup: export / import
  function exportData(){
    const data={app:"together-apart",version:8,exported_at:new Date().toISOString(),schedule:active&&active.name,
      time_blocks:timeBlocks,assignees,week_template:safeTemplates,overrides,anchor_date:anchorDate,
      holiday_cal:holidayCalKey,appointments,settings};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`together-apart-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
  function importData(file){
    if(!canEdit)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const d=JSON.parse(String(reader.result));
        if(d.app!=="together-apart")throw new Error("not a backup");
        if(!confirm("Replace this schedule with the backup? Everyone with access will see the restored version."))return;
        if(d.time_blocks)setTimeBlocks(d.time_blocks);
        if(d.assignees)setAssignees(upgradeAssignees(d.assignees));
        if(d.week_template)setTemplates(d.week_template);
        if(d.overrides)setOverrides(d.overrides);
        if(d.anchor_date)setAnchorDate(d.anchor_date);
        if(d.holiday_cal)setHolidayCalKey(d.holiday_cal);
        if(d.appointments)setAppointments(d.appointments);
        if(d.settings)setSettings(d.settings);
        notify("Backup restored — syncing now");
      }catch{alert("Sorry, that file doesn't look like a Together Apart backup.")}
    };
    reader.readAsText(file);
  }
  function handleSetAssignee(dStr,blockId,id,newA){
    if(newA)setAssignees(prev=>({...prev,[id]:newA}));
    setOverrides(prev=>({...prev,[dStr]:{...(prev[dStr]||{}),[blockId]:{...(prev[dStr]?.[blockId]||{}),assigneeId:id}}}));
  }
  function handleSetNote(dStr,blockId,note){
    setOverrides(prev=>{
      const existing=prev[dStr]?.[blockId]||{};
      const blockEntry=note?{...existing,note}:{...existing};
      if(!note)delete blockEntry.note;
      const dayEntry={...(prev[dStr]||{}),[blockId]:blockEntry};
      if(Object.keys(dayEntry[blockId]).length===0)delete dayEntry[blockId];
      return{...prev,[dStr]:dayEntry};
    });
  }
  function handleSaveAppt(dStr,appt){
    setAppointments(prev=>{
      const list=prev[dStr]||[];
      const exists=list.find(a=>a.id===appt.id);
      return{...prev,[dStr]:exists?list.map(a=>a.id===appt.id?appt:a):[...list,appt]};
    });
  }
  function handleDeleteAppt(dStr,id){
    setAppointments(prev=>{
      const list=(prev[dStr]||[]).filter(a=>a.id!==id);
      const next={...prev};
      if(list.length)next[dStr]=list;else delete next[dStr];
      return next;
    });
  }
  const TABS=[
    {id:"today",icon:"🏠",label:"Today"},
    {id:"calendar",icon:"📅",label:"Calendar"},
    ...(canEdit?[{id:"setup",icon:"🧩",label:"Setup"}]:[]),
    {id:"share",icon:"👥",label:"Family"},
  ];
  const SETUP_TABS=[
    {id:"template",label:"Fortnight pattern"},
    {id:"blocks",label:"Time blocks"},
    {id:"people",label:"Children & people"},
    {id:"holidays",label:"Holidays"},
  ];
  const mainTab=TABS.some(t=>t.id===tab)?tab:"today";
  const currentTab=mainTab==="setup"?setupTab:mainTab;
  const goDayFromToday=(y,m,d)=>{setOpenDay({y,m,d,t:Date.now()});setTab("calendar")};
  const scheduleSwitch=(
    <select className="cal-switch" value={calId} aria-label="Switch schedule"
      onChange={e=>{if(e.target.value==="__new"){setShowOnboarding(true)}else{setActiveCalId(e.target.value)}}}>
      {activeList.map(m=>(<option key={m.calendar_id} value={m.calendar_id}>{m.name||"Schedule"} · {ROLE_LABEL[m.role]}</option>))}
      <option value="__new">＋ Create or join another schedule…</option>
    </select>
  );
  const pendingCount=role==="owner"?members.filter(m=>m.status==="pending").length:0;
  const loadingScreen=(
    <div className="app">
      <div style={{textAlign:"center",padding:"80px 20px",color:"var(--text-muted)",fontSize:".85rem"}}>Loading…</div>
    </div>
  );
  if(session===undefined)return loadingScreen;
  if(!session)return <div className="app"><SignInView/></div>;
  if(memberships===null)return loadingScreen;
  if(!active||showOnboarding)return(
    <div className="app">
      <OnboardingView session={session} pending={pendingList} hasLocalData={hasLocalData}
        onCreate={createSchedule} onJoin={joinSchedule} onCancelRequest={cancelRequest} onRefresh={loadMemberships}
        onBack={active?()=>setShowOnboarding(false):null}/>
      {DEMO&&<DemoBar/>}
    </div>
  );
  return(
    <div className={`app${mainTab==="today"?" on-today":""}`}>
      <header className="app-header">
        <div className="brand">
          <span className="brand-logo">🤝</span>
          <div>
            <h1 className="brand-title">Together Apart</h1>
            {scheduleSwitch}
          </div>
        </div>
        <Legend assignees={assignees}/>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          {(settings.children||[]).length>0&&<span className="kids-line">🧒 {(settings.children||[]).map(k=>k.name).join(" · ")}</span>}
          <button className="help-btn" title="How does this work?" onClick={()=>setShowTour(true)}>?</button>
        </div>
      </header>
      {!canEdit&&(
        <div className="role-banner">👀 You're a caregiver here: you can see the schedule and add appointments. Custody changes are made by the parents.</div>
      )}
      <nav className="tabs" aria-label="Main">
        {TABS.map(t=>(
          <button key={t.id} className={`tab-btn${mainTab===t.id?" active":""}`} aria-current={mainTab===t.id?"page":undefined}
            onClick={()=>setTab(t.id)}><span className="tab-ico" aria-hidden="true">{t.icon}</span><span className="tab-lbl">{t.label}</span>{t.id==="share"&&pendingCount>0&&<span className="tab-dot">{pendingCount}</span>}</button>
        ))}
      </nav>
      {mainTab==="setup"&&(
        <div className="sub-tabs" role="tablist">
          {SETUP_TABS.map(t=>(<button key={t.id} role="tab" aria-selected={setupTab===t.id} className={`sub-tab${setupTab===t.id?" active":""}`} onClick={()=>setSetupTab(t.id)}>{t.label}</button>))}
        </div>
      )}
      {currentTab==="today"&&(
        <TodayView session={session} calName={active.name||"Schedule"} children={settings.children}
          assignees={assignees} timeBlocks={timeBlocks} weekTemplate={safeTemplates} overrides={overrides}
          anchorDate={anchorDate} appointments={appointments} holidayCalKey={holidayCalKey}
          onOpenDay={goDayFromToday} onSaveAppt={handleSaveAppt}
          headerExtras={<div className="today-switch">{scheduleSwitch}<button className="help-btn light" title="How does this work?" onClick={()=>setShowTour(true)}>?</button></div>}/>
      )}
      {currentTab==="calendar"&&(
        <CalendarView year={year} month={month} setYear={setYear} setMonth={setMonth}
          timeBlocks={timeBlocks} assignees={assignees}
          weekTemplate={safeTemplates} overrides={overrides}
          anchorDate={anchorDate}
          onSetAssignee={canEdit?handleSetAssignee:null} onSetNote={canEdit?handleSetNote:null}
          holidayCalKey={holidayCalKey}
          appointments={appointments} onSaveAppt={handleSaveAppt} onDeleteAppt={handleDeleteAppt} openDay={openDay}/>
      )}
      {currentTab==="template"&&(
        <TemplateEditor timeBlocks={timeBlocks} assignees={assignees}
          weekTemplate={safeTemplates} setWeekTemplate={setTemplates}
          year={year} month={month}
          overrides={overrides} setOverrides={setOverrides}
          anchorDate={anchorDate} setAnchorDate={setAnchorDate}/>
      )}
      {currentTab==="blocks"&&<TimeBlocksEditor timeBlocks={timeBlocks} setTimeBlocks={setTimeBlocks} notify={notify}/>}
      {currentTab==="people"&&<ChildrenEditor settings={settings} setSettings={setSettings} notify={notify}/>}
      {currentTab==="people"&&<AssigneesEditor assignees={assignees} setAssignees={setAssignees} notify={notify}/>}
      {currentTab==="holidays"&&<HolidaySettingsView holidayCalKey={holidayCalKey} setHolidayCalKey={setHolidayCalKey}/>}
      {currentTab==="share"&&(
        <MembersView cal={{id:calId,name:active.name||"Schedule"}} role={role} session={session}
          assignees={assignees} syncStatus={syncStatus} lastSync={lastSync}
          members={members} onReloadMembers={async()=>{await loadMembers();await loadMemberships();}}
          onLeft={()=>{setActiveCalId(null);saveLS("ta_active_cal",null);loadMemberships();setTab("today")}}
          onRenamed={loadMemberships}
          onExport={exportData} onImport={importData} canEdit={canEdit} notify={notify}
          onOpenWizard={()=>setShowWizard(true)}/>
      )}
      {toast&&(
        <div className="toast" role="status">
          <span>{toast.msg}</span>
          {toast.undo&&<button onClick={()=>{toast.undo();setToast(null);clearTimeout(toastTimer.current)}}>Undo</button>}
        </div>
      )}
      {showWizard&&role==="owner"&&(
        <SetupWizard calId={calId} calName={active.name||"your schedule"} assignees={assignees} setAssignees={setAssignees}
          timeBlocks={timeBlocks} setTemplates={setTemplates} setAnchorDate={setAnchorDate}
          holidayCalKey={holidayCalKey} setHolidayCalKey={setHolidayCalKey} settings={settings} setSettings={setSettings}
          onLater={()=>{saveLS("ta_wiz_later_"+calId,true);setShowWizard(false)}}
          onFinish={custom=>{setSettings(s=>({...s,onboarded:true}));setShowWizard(false);if(custom){setTab("setup");setSetupTab("template")}else setTab("today");notify("Your schedule is ready 🎉")}}/>
      )}
      {showTour&&!showWizard&&(
        <RoleTour role={role} calName={active.name||"this schedule"} onClose={()=>{saveLS("ta_tour_"+calId,true);setShowTour(false)}}/>
      )}
      {DEMO&&<DemoBar/>}
      <footer style={{textAlign:"center",marginTop:20,fontSize:".7rem",color:"var(--text-light)"}}>
        {DEMO?"Demo mode · nothing leaves this device":"Signed in as "+session.user.email} · Together Apart v8
      </footer>
    </div>
  );
}
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null}}
  static getDerivedStateFromError(e){return{err:e}}
  render(){
    if(this.state.err)return(
      <div style={{padding:20,fontFamily:"monospace",background:"#fee",border:"1px solid red",margin:20,borderRadius:8}}>
        <strong>Error:</strong><br/>{String(this.state.err)}<br/>
        <pre style={{fontSize:12,whiteSpace:"pre-wrap"}}>{this.state.err?.stack}</pre>
      </div>
    );
    return this.props.children;
  }
}
try{
  ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
}catch(e){
  document.getElementById("root").innerHTML='<div style="padding:20px;font-family:monospace;background:#fee;border:1px solid red;margin:20px;border-radius:8px"><strong>Startup Error:</strong><br/>'+String(e)+'</div>';
}
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
