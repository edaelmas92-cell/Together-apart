<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Together Apart · Co-Parenting Calendar</title>
<!-- PWA -->
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#1f6f9f"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Together Apart"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f2f7fa;--surface:#fff;--surface2:#f7fafc;
  --border:#dde7ee;--border-strong:#c3d3de;
  --text:#13293d;--text-muted:#5f7486;--text-light:#a9b8c4;
  --accent:#1f6f9f;--accent-light:#e3f2f6;
  --hero1:#1f6f9f;--hero2:#3fb7c4;--coral:#f08a6c;--navy:#13293d;
  --w1:#e8f0fb;--w1-text:#2d5fa6;--w1-border:#b5cef5;
  --w2:#fef3e2;--w2-text:#8a5a0a;--w2-border:#f5d898;
  --weekend-bg:#eef4f7;
  --today-bg:#1f6f9f;--today-fg:#fff;
  --r-sm:8px;--r-md:12px;--r-lg:18px;--r-xl:24px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.06);
  --shadow-md:0 4px 20px rgba(0,0,0,.09);
  --shadow-lg:0 8px 40px rgba(0,0,0,.13);
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.5}
button{font-family:'DM Sans',sans-serif}
/* ── App shell ── */
.app{max-width:1040px;margin:0 auto;padding:20px 14px 80px}
.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{font-size:1.8rem;line-height:1}
.brand-title{font-family:'DM Sans',sans-serif;letter-spacing:-.01em;font-size:1.4rem;font-weight:600;line-height:1.1;color:var(--text)}
.brand-sub{font-size:.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;margin-top:1px}
/* ── Tabs ── */
.tabs{display:flex;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:3px;margin-bottom:16px;width:fit-content;flex-wrap:wrap}
.tab-btn{padding:6px 14px;border:none;border-radius:9px;background:none;font-size:.8rem;font-weight:500;color:var(--text-muted);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tab-btn.active{background:var(--bg);color:var(--text);box-shadow:var(--shadow-sm)}
/* ── Card ── */
.card{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow-md);border:1px solid var(--border);overflow:hidden}
.section-head{padding:16px 18px;border-bottom:1px solid var(--border);background:var(--surface2)}
.section-title{font-family:'DM Sans',sans-serif;letter-spacing:-.01em;font-size:1rem;font-weight:600}
.section-sub{font-size:.75rem;color:var(--text-muted);margin-top:2px}
.section-body{padding:16px 18px}
/* ── Btn system ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:none;border-radius:var(--r-sm);font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:500;cursor:pointer;transition:opacity .15s,box-shadow .15s}
.btn:hover{opacity:.88;box-shadow:var(--shadow-sm)}
.btn-accent{background:var(--accent);color:#fff}
.btn-ghost{background:var(--bg);border:1px solid var(--border);color:var(--text-muted)}
.btn-ghost:hover{color:var(--text)}
.btn-danger{background:#fde8e8;color:#c0392b;border:1px solid #f5c2c2}
.btn-xs{padding:3px 8px;font-size:.72rem}
.btn-icon{width:28px;height:28px;padding:0;border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;background:none;border:1px solid var(--border);cursor:pointer;font-size:.9rem;color:var(--text-muted);transition:background .15s,color .15s}
.btn-icon:hover{background:var(--border);color:var(--text)}
/* ── Calendar nav ── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--surface2);flex-wrap:wrap;gap:8px}
.cal-nav-left{display:flex;align-items:center;gap:10px}
.cal-title{font-family:'DM Sans',sans-serif;letter-spacing:-.01em;font-size:1.1rem;font-weight:600}
.cal-nav-right{display:flex;align-items:center;gap:6px}
.week-badge{font-size:.7rem;padding:3px 9px;border-radius:99px;font-weight:600;letter-spacing:.03em}
.week-badge.w1{background:var(--w1);color:var(--w1-text);border:1px solid var(--w1-border)}
.week-badge.w2{background:var(--w2);color:var(--w2-text);border:1px solid var(--w2-border)}
/* ── Dynamic grid (CSS vars set inline) ── */
.cal-grid-head{display:grid;border-bottom:2px solid var(--border);background:var(--surface2);padding:0 6px}
.cal-grid-head-cell{padding:8px 5px;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);display:flex;align-items:center;gap:3px;white-space:nowrap}
.grid-body{padding:2px 6px}
/* ── Day row ── */
.day-row{display:grid;padding:2px 0;border-bottom:1px solid var(--border);align-items:stretch;gap:2px}
.day-row:last-child{border-bottom:none}
.day-row.is-weekend{background:var(--weekend-bg);border-radius:var(--r-sm)}
.day-row.is-today .date-cell{background:var(--today-bg);border-radius:var(--r-sm);color:var(--today-fg)}
.day-row.is-today .date-dow{color:rgba(255,255,255,.65)}
.date-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 4px;user-select:none}
.date-num{font-family:'DM Sans',sans-serif;letter-spacing:-.01em;font-size:.95rem;font-weight:600;line-height:1}
.date-dow{font-size:.56rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-top:1px}
/* week stripe on date cell */
.day-row.wk1 .date-cell{border-left:3px solid var(--w1-border)}
.day-row.wk2 .date-cell{border-left:3px solid var(--w2-border)}
.day-row.is-today .date-cell{border-left-color:transparent}
/* ── Block cell ── */
.block-cell{display:flex;flex-direction:column;gap:1px;position:relative}
.assign-btn{
  flex:1;min-height:34px;padding:4px 5px 4px 7px;
  border:1.5px solid transparent;border-radius:var(--r-sm);
  cursor:pointer;font-size:.7rem;font-weight:500;
  display:flex;align-items:center;justify-content:space-between;
  gap:3px;transition:transform .1s,box-shadow .1s,filter .15s;
  position:relative;overflow:hidden
}
.assign-btn:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.assign-btn:active{transform:none}
.assign-btn.is-template{border-style:dashed;border-color:currentColor;filter:opacity(.82)}
.assign-btn.is-override::before{
  content:'';position:absolute;top:0;left:0;bottom:0;width:3px;
  background:currentColor;opacity:.5;border-radius:2px 0 0 2px
}
.assign-label{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.assign-icons{display:flex;align-items:center;gap:2px;flex-shrink:0}
.note-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6;flex-shrink:0}
.note-btn-inline{background:none;border:none;cursor:pointer;font-size:.75rem;padding:0;opacity:.45;line-height:1;color:inherit;transition:opacity .1s}
.note-btn-inline:hover{opacity:1}
/* ── Picker dropdown ── */
.picker-wrap{position:relative;flex:1;display:flex;flex-direction:column}
.picker-dropdown{
  position:fixed;z-index:500;
  background:var(--surface);border:1px solid var(--border-strong);
  border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  padding:6px;min-width:170px;max-height:320px;overflow-y:auto
}
.picker-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--r-sm);cursor:pointer;font-size:.8rem;transition:background .1s}
.picker-item:hover,.picker-item.active{background:var(--bg)}
.picker-item.active{font-weight:600}
.p-swatch{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.picker-sep{height:1px;background:var(--border);margin:4px 0}
.picker-muted{color:var(--text-muted);font-size:.75rem}
/* ── Inline add form ── */
.add-inline{padding:4px;display:flex;flex-direction:column;gap:6px}
.add-inline input{width:100%;padding:5px 8px;border:1px solid var(--border-strong);border-radius:var(--r-sm);font-size:.8rem;background:var(--bg);outline:none;font-family:'DM Sans',sans-serif;color:var(--text)}
.add-inline input:focus{border-color:var(--accent)}
.palette-row{display:flex;gap:4px;flex-wrap:wrap}
.pal-dot{width:17px;height:17px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .12s}
.pal-dot.on{transform:scale(1.25)}
.add-row{display:flex;gap:5px}
/* ── Note popover ── */
.note-popover{
  position:fixed;z-index:600;
  background:var(--surface);border:1px solid var(--border-strong);
  border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  padding:14px;width:260px
}
.note-popover h4{font-family:'DM Sans',sans-serif;letter-spacing:-.01em;font-size:.9rem;font-weight:600;margin-bottom:8px;color:var(--text)}
.note-popover textarea{
  width:100%;height:80px;padding:8px 10px;border:1px solid var(--border-strong);
  border-radius:var(--r-sm);font-family:'DM Sans',sans-serif;font-size:.8rem;
  resize:none;outline:none;background:var(--bg);color:var(--text);line-height:1.5
}
.note-popover textarea:focus{border-color:var(--accent)}
.note-actions{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
/* ── Summary bar ── */
.summary{padding:12px 18px 16px;border-top:1px solid var(--border);background:var(--surface2)}
.summary-bar{height:8px;border-radius:99px;background:var(--border);overflow:hidden;display:flex;margin-bottom:8px}
.summary-fill{height:100%;transition:width .5s ease}
.summary-chips{display:flex;gap:6px;flex-wrap:wrap}
.s-chip{font-size:.7rem;padding:2px 9px;border-radius:99px;font-weight:500}
/* ── Legend ── */
.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:4px;font-size:.73rem;color:var(--text-muted)}
.leg-swatch{width:12px;height:12px;border-radius:3px;border:1.5px solid rgba(0,0,0,.1)}
.leg-sep{color:var(--text-light);font-size:.7rem}
.leg-hint{font-size:.68rem;color:var(--text-light);display:flex;align-items:center;gap:3px}
/* ── Template editor ── */
.tpl-week-tabs{display:flex;gap:3px;margin-bottom:14px}
.tpl-week-btn{padding:6px 16px;border-radius:99px;border:1.5px solid var(--border);font-size:.8rem;font-weight:600;cursor:pointer;background:none;transition:background .15s,border-color .15s}
.tpl-week-btn.w1.active{background:var(--w1);color:var(--w1-text);border-color:var(--w1-border)}
.tpl-week-btn.w2.active{background:var(--w2);color:var(--w2-text);border-color:var(--w2-border)}
.tpl-week-btn:not(.active){color:var(--text-muted)}
.tpl-grid{display:grid;gap:2px;margin-bottom:14px}
.tpl-row-head{padding:5px 4px;font-size:.67rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);display:flex;align-items:center;gap:3px}
.tpl-day-lbl{font-size:.8rem;font-weight:500;color:var(--text);padding:4px 4px;display:flex;align-items:center}
.tpl-apply-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:4px;border-top:1px solid var(--border);margin-top:6px}
.tpl-apply-note{font-size:.74rem;color:var(--text-muted)}
/* ── Week anchor picker ── */
.anchor-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--border);background:var(--surface2)}
.anchor-label{font-size:.78rem;color:var(--text-muted)}
.anchor-input{padding:5px 8px;border:1px solid var(--border-strong);border-radius:var(--r-sm);font-size:.78rem;font-family:'DM Sans',sans-serif;background:var(--bg);outline:none;color:var(--text)}
.anchor-input:focus{border-color:var(--accent)}
/* ── Time blocks manager ── */
.tbl-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.tbl-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);transition:box-shadow .15s,background .15s;margin-bottom:6px}
.tbl-row.drag-over{box-shadow:0 0 0 2px var(--accent);background:var(--accent-light)}
.drag-handle{color:var(--text-light);font-size:1rem;cursor:grab;user-select:none;padding:0 2px}
.drag-handle:active{cursor:grabbing}
.icon-pick{width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.1rem;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:border-color .15s}
.icon-pick:hover{border-color:var(--accent)}
.tbl-label-input{flex:1;min-width:0;padding:7px 10px;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:500;color:var(--text);outline:none;transition:border-color .15s,background .15s}
.tbl-label-input:hover{border-color:var(--border)}
.tbl-label-input:focus{border-color:var(--accent);background:var(--surface)}
.tbl-add-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px dashed var(--border-strong);border-radius:var(--r-md)}
.tbl-add-row .tbl-label-input{border-color:var(--border);background:var(--surface);min-width:140px}
.move-btns{display:flex;flex-direction:column;gap:1px}
.move-btn{width:22px;height:16px;border:none;background:none;color:var(--text-muted);font-size:.6rem;cursor:pointer;border-radius:4px;padding:0;line-height:1}
.move-btn:hover:not(:disabled){background:var(--accent-light);color:var(--text)}
.move-btn:disabled{opacity:.25;cursor:default}
.icon-pop-wrap{position:relative}
.icon-pop{position:absolute;top:40px;left:0;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-lg);padding:8px;display:grid;grid-template-columns:repeat(6,32px);gap:4px}
.icon-pick-row{display:flex;gap:5px;flex-wrap:wrap}
/* ── Undo toast ── */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;background:#332e28;color:#fff;padding:10px 14px;border-radius:var(--r-md);box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:14px;font-size:.82rem;max-width:calc(100vw - 32px)}
.toast button{background:none;border:none;color:#f0c890;font-weight:600;font-family:'DM Sans',sans-serif;font-size:.82rem;cursor:pointer;padding:0}
.icon-opt{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);cursor:pointer;font-size:1rem;border:1.5px solid transparent;transition:border-color .1s,background .1s}
.icon-opt:hover,.icon-opt.sel{border-color:var(--accent);background:var(--accent-light)}
/* ── Assignees manager ── */
.asm-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.asm-chip{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:.77rem;font-weight:500;border:1.5px solid rgba(0,0,0,.1)}
.asm-del{background:none;border:none;cursor:pointer;font-size:.85rem;opacity:.45;padding:0;line-height:1;color:inherit}
.asm-del:hover{opacity:1}
/* ── Scrollable overlay backdrop ── */
.overlay-backdrop{position:fixed;inset:0;z-index:400;background:transparent}
/* ── Holiday indicator ── */
.holiday-pill{display:block;font-size:.5rem;padding:1px 5px;border-radius:99px;background:#fef3cd;color:#7a5c00;border:1px solid #f0d86a;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.5;margin-top:2px}
.day-row.is-holiday .date-cell{background:linear-gradient(to bottom,#fffdf0,#fffbdc)}
.day-row.is-weekend.is-holiday .date-cell{background:linear-gradient(to bottom,#fffdf0,#fff8d0)}
.day-row.is-today.is-holiday .date-cell{background:var(--today-bg)}
/* ── Holiday list card ── */
.hol-list{display:flex;flex-direction:column;gap:6px}
.hol-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#fffcee;border:1px solid #f0d86a;border-radius:var(--r-md)}
.hol-item.past{opacity:.45}
.hol-name{flex:1;font-size:.82rem;font-weight:600;color:var(--text)}
.hol-range{font-size:.72rem;color:var(--text-muted);margin-top:1px}
.hol-days{font-size:.7rem;color:var(--text-muted);text-align:right;white-space:nowrap}
.hol-select{padding:6px 10px;border:1px solid var(--border-strong);border-radius:var(--r-sm);font-family:'DM Sans',sans-serif;font-size:.82rem;background:var(--bg);color:var(--text);outline:none;cursor:pointer}
/* ── View selector ── */
.view-selector{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:2px}
.view-btn{padding:4px 10px;border:none;border-radius:6px;background:none;font-size:.72rem;font-weight:500;color:var(--text-muted);cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
.view-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
/* ── Day view ── */
.day-view{padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.day-block-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--border)}
.day-block-label{width:80px;font-size:.75rem;color:var(--text-muted);flex-shrink:0}
.day-block-assign{flex:1}
.day-appts{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.day-appt-card{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r-md);border:1.5px solid transparent}
.day-appt-time-big{font-size:1.4rem;font-weight:700;min-width:54px;text-align:center}
.day-appt-title{font-size:.9rem;font-weight:500}
/* ── Week view ── */
.week-grid{overflow-x:auto;padding:0 6px 8px}
.week-table{width:100%;border-collapse:collapse;min-width:480px}
.week-table th{padding:6px 4px;font-size:.7rem;font-weight:600;text-align:center;color:var(--text-muted);border-bottom:2px solid var(--border);background:var(--surface2)}
.week-table th.today-col{color:var(--today-bg);border-bottom-color:var(--today-bg)}
.week-table td{padding:2px 3px;border-bottom:1px solid var(--border);vertical-align:middle}
.week-block-head{font-size:.68rem;color:var(--text-muted);padding:4px 6px;white-space:nowrap;text-align:right;border-right:1px solid var(--border);background:var(--surface2)}
.week-cell-btn{width:100%;padding:4px 5px;border:none;border-radius:6px;font-size:.68rem;font-weight:500;cursor:pointer;text-align:center;min-height:28px;transition:opacity .15s}
.week-cell-btn:hover{opacity:.8}
.week-appt-row td{padding:3px;border-bottom:2px solid var(--border)}
.week-appt-cell{display:flex;flex-direction:column;gap:2px;min-height:20px}
.week-appt-pill{font-size:.6rem;padding:1px 5px;border-radius:99px;display:flex;gap:3px;align-items:center;cursor:pointer;border:1px solid transparent}
.week-appt-time{font-weight:700}
/* ── Year view ── */
.year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px}
@media(max-width:640px){.year-grid{grid-template-columns:repeat(2,1fr);gap:8px;padding:10px}}
.mini-cal{background:var(--surface2);border-radius:var(--r-md);border:1px solid var(--border);padding:8px;cursor:default}
.mini-cal-title{font-size:.72rem;font-weight:600;color:var(--text);margin-bottom:5px;text-align:center}
.mini-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.mini-dow{font-size:.48rem;color:var(--text-light);text-align:center;padding:1px 0}
.mini-day{width:100%;aspect-ratio:1;border-radius:3px;font-size:.42rem;display:flex;align-items:center;justify-content:center;color:var(--text-muted);cursor:pointer;transition:opacity .15s}
.mini-day:hover{opacity:.75}
.mini-day.today{outline:2px solid var(--today-bg);outline-offset:1px}
/* ── Appointments ── */
.appt-row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;padding:3px 4px 4px;border-top:1px dashed var(--border)}
.appt-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;font-size:.72rem;font-weight:500;cursor:pointer;border:1.5px solid transparent;transition:opacity .15s;max-width:100%}
.appt-pill:hover{opacity:.8}
.appt-time{font-size:.85rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.appt-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt-add-btn{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;border:1.5px dashed var(--border-strong);background:none;font-size:.68rem;color:var(--text-muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:border-color .15s,color .15s}
.appt-add-btn:hover{border-color:var(--accent);color:var(--accent)}
/* appointment modal */
.appt-modal-backdrop{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px}
.appt-modal{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);padding:20px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.appt-modal h3{font-family:'DM Sans',sans-serif;letter-spacing:-.01em;font-size:1rem;font-weight:600;color:var(--text)}
.appt-modal label{font-size:.75rem;color:var(--text-muted);display:block;margin-bottom:3px}
.appt-modal input[type=text],.appt-modal input[type=time]{width:100%;padding:7px 10px;border:1px solid var(--border-strong);border-radius:var(--r-sm);font-family:'DM Sans',sans-serif;font-size:.85rem;background:var(--bg);color:var(--text);outline:none}
.appt-modal input:focus{border-color:var(--accent)}
.appt-time-big{font-size:1.6rem;font-weight:700;color:var(--text);text-align:center;padding:4px 0}
.appt-colors{display:flex;gap:6px;flex-wrap:wrap}
.appt-color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:transform .1s}
.appt-color-dot.selected{border-color:var(--text);transform:scale(1.15)}
.appt-modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
/* ── Share / sync tab ── */
.share-card{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow-md);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;gap:0}
.share-section{padding:16px 18px;border-bottom:1px solid var(--border)}
.share-section:last-child{border-bottom:none}
.share-title{font-family:'DM Sans',sans-serif;letter-spacing:-.01em;font-size:.95rem;font-weight:600;margin-bottom:4px}
.share-sub{font-size:.75rem;color:var(--text-muted);margin-bottom:12px}
.sync-status{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;padding:3px 8px;border-radius:99px;border:1px solid var(--border)}
.sync-status.ok{background:#d5f0e0;color:#276645;border-color:#80d0a8}
.sync-status.pending{background:#fef3e2;color:#8a5a0a;border-color:#f5d898}
.sync-status.error{background:#fee;color:#c0392b;border-color:#f5b7b1}
.sync-status.offline{background:#f0efed;color:#6b645c;border-color:#cec8bf}
/* ── Auth ── */
.auth-wrap{max-width:420px;margin:40px auto 0}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-md);padding:28px 24px;text-align:center}
.auth-title{font-family:'DM Sans',sans-serif;letter-spacing:-.01em;font-size:1.15rem;font-weight:600;margin-bottom:6px}
.auth-sub{font-size:.8rem;color:var(--text-muted);margin-bottom:18px;line-height:1.5}
.auth-input{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--r-sm);font-size:.9rem;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);outline:none;margin-bottom:10px;text-align:center}
.auth-err{font-size:.75rem;color:#c0392b;margin-top:8px}
.auth-or{display:flex;align-items:center;gap:10px;margin:16px 0 10px;color:var(--text-muted);font-size:.75rem}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--border)}
.auth-note{font-size:.7rem;color:var(--text-muted);margin-top:14px;line-height:1.5}
/* ── Invite / members ── */
.invite-box{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px dashed var(--border-strong);border-radius:var(--r-sm);padding:8px 10px}
.invite-url{flex:1;font-size:.72rem;font-family:monospace;word-break:break-all;color:var(--text)}
.member-row{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;padding:6px 0;border-bottom:1px solid var(--border)}
.member-row:last-child{border-bottom:none}
/* ── v8: onboarding, access & roles ── */
.onb-wrap{max-width:760px;margin:30px auto 0}
.onb-head{text-align:center;margin-bottom:18px}
.onb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.onb-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-md);padding:20px 18px;margin-bottom:14px}
.onb-msg{margin-top:10px;font-size:.78rem;color:#276645;background:#d5f0e0;border:1px solid #80d0a8;border-radius:var(--r-sm);padding:8px 10px}
.code-input{font-family:monospace;font-size:1.15rem;letter-spacing:.15em;text-transform:uppercase}
.code-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg);border:1px dashed var(--border-strong);border-radius:var(--r-md);padding:10px 12px}
.code-big{font-family:monospace;font-size:1.35rem;font-weight:600;letter-spacing:.12em;flex:1;min-width:140px}
.req-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--border);font-size:.82rem}
.req-row:last-child{border-bottom:none}
.role-select{padding:5px 8px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);font-family:'DM Sans',sans-serif;font-size:.76rem;color:var(--text)}
.role-badge{font-size:.68rem;padding:2px 8px;border-radius:99px;border:1px solid var(--border);color:var(--text-muted)}
.role-badge.owner{background:var(--accent-light);color:#7a5a2e;border-color:#e2cba8}
.role-badge.parent{background:#e8f0fb;color:#2d5fa6;border-color:#b5cef5}
.role-badge.caregiver{background:#f0efed;color:#6b645c}
.cal-switch{margin-top:2px;max-width:260px;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:.72rem;color:var(--text-muted);padding:0;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.role-banner{font-size:.76rem;background:#f0efed;border:1px solid var(--border);border-radius:var(--r-md);padding:8px 12px;margin-bottom:12px;color:#6b645c}
.tab-dot{display:inline-block;margin-left:5px;min-width:16px;height:16px;line-height:16px;border-radius:99px;background:#c0392b;color:#fff;font-size:.62rem;text-align:center;padding:0 4px}
/* ── v8.2: setup wizard, role tour, demo ── */
.wiz-backdrop{position:fixed;inset:0;z-index:300;background:rgba(51,46,40,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.wiz-card{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;padding:22px 22px 18px}
.tour-card{max-width:420px}
.wiz-progress{display:flex;gap:5px;margin-bottom:10px}
.wiz-dot{flex:1;height:4px;border-radius:99px;background:var(--border)}
.wiz-dot.on{background:var(--accent)}
.wiz-step-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);margin-bottom:10px}
.wiz-body{min-height:170px}
.wiz-emoji{font-size:2.4rem;text-align:center;margin:6px 0 4px}
.wiz-title{font-family:'DM Sans',sans-serif;letter-spacing:-.01em;font-size:1.2rem;font-weight:600;margin-bottom:6px}
.wiz-text{font-size:.84rem;color:#5d554c;line-height:1.55;margin-bottom:12px}
.wiz-row{display:flex;gap:8px;align-items:center}
.wiz-input{text-align:left!important}
.wiz-label{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:600;margin:6px 0 4px}
.wiz-swatch{width:14px;height:14px;border-radius:50%;border:1px solid;display:inline-block}
.wiz-presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:12px}
.wiz-preset{text-align:left;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--r-md);background:var(--bg);cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--text)}
.wiz-preset.on{border-color:var(--accent);background:var(--accent-light)}
.wiz-preset-name{font-weight:600;font-size:.84rem}
.wiz-preset-desc{font-size:.72rem;color:var(--text-muted);margin-top:2px;line-height:1.4}
.wiz-strip-label{font-size:.68rem;color:var(--text-muted);margin-bottom:4px}
.wiz-strip{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-bottom:10px}
.wiz-day{border-radius:6px;padding:4px 0;display:flex;flex-direction:column;align-items:center;font-size:.6rem;line-height:1.2}
.wiz-day b{font-size:.75rem}
.wiz-day.gap{margin-left:6px}
.wiz-options{display:flex;flex-direction:column;gap:6px}
.wiz-tips{font-size:.82rem;line-height:1.55;padding-left:18px;color:#5d554c}
.wiz-tips li{margin-bottom:6px}
.wiz-actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.kids-line{font-size:.78rem;color:var(--text-muted);background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:3px 10px}
.help-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-muted);font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.help-btn:hover{border-color:var(--accent);color:var(--text)}
.demo-bar{position:fixed;right:14px;bottom:14px;z-index:250;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.demo-pill{background:#5c3080;color:#fff;border:none;border-radius:99px;padding:7px 12px;font-size:.72rem;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;box-shadow:var(--shadow-md)}
.demo-menu{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-lg);padding:8px;min-width:250px;display:flex;flex-direction:column}
.demo-menu hr{border:none;border-top:1px solid var(--border);margin:6px 0}
.demo-menu-title{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:2px 6px 6px}
.demo-item{text-align:left;background:none;border:none;padding:7px 8px;border-radius:var(--r-sm);font-size:.78rem;font-family:'DM Sans',sans-serif;color:var(--text);cursor:pointer}
.demo-item:hover{background:var(--bg)}
.demo-item.on{background:#e8d9f5;font-weight:600}
@media (max-width:520px){.wiz-strip{gap:2px}.wiz-day{font-size:.5rem}.wiz-card{padding:18px 16px 14px}}
/* ── v8.3: Oceaan, Today screen, agenda list, phone layout ── */
.btn-accent{background:var(--accent);color:#fff}
.app.on-today .app-header{display:none}
.tabs{align-items:center}
.tab-btn{display:inline-flex;align-items:center;gap:6px;position:relative}
.tab-ico{font-size:1rem;line-height:1}
.tab-btn.active{color:var(--accent);font-weight:700}
.sub-tabs{display:flex;gap:6px;overflow-x:auto;margin:-6px 0 14px;padding-bottom:2px;scrollbar-width:none}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:600;color:var(--text-muted);cursor:pointer}
.sub-tab.active{background:var(--navy);border-color:var(--navy);color:#fff}
/* Today */
.today{position:relative;padding-bottom:80px}
.today-hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:28px;padding:20px 20px 64px}
.today-hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.today-hello{font-size:1.45rem;font-weight:800;letter-spacing:-.02em}
.today-switch{display:flex;align-items:center;gap:8px;margin-top:4px}
.today-switch .cal-switch{color:rgba(255,255,255,.88);font-weight:600}
.today-switch .cal-switch option{color:var(--text)}
.help-btn.light{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.45);color:#fff}
.today-kids{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.today-kid{background:rgba(255,255,255,.24);border-radius:99px;padding:4px 12px 4px 4px;display:inline-flex;align-items:center;gap:7px;font-size:.85rem;font-weight:700}
.today-kid i{width:30px;height:30px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:1rem}
.today-card{background:var(--surface);border-radius:26px;padding:18px;margin:-46px 12px 0;position:relative;box-shadow:0 10px 28px rgba(31,111,159,.18)}
.today-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}
.today-who{display:flex;align-items:center;gap:12px;margin-top:8px}
.who-badge{width:50px;height:50px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;font-weight:800;flex:none}
.today-who-name{font-size:1.3rem;font-weight:800;letter-spacing:-.01em}
.today-who-sub{font-size:.8rem;color:var(--text-muted);margin-top:1px}
.today-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.today-stat{background:var(--accent-light);border-radius:16px;padding:10px;text-align:center;color:var(--accent)}
.today-stat b{display:block;font-size:1.1rem;font-weight:800}
.today-stat span{font-size:.74rem;font-weight:600}
.today-hol{margin-top:10px;font-size:.8rem;font-weight:600;background:#fff4e0;color:#7a4f00;border-radius:12px;padding:8px 10px}
.today-sec{font-size:.92rem;font-weight:800;margin:20px 4px 10px}
.today-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.today-day{border:none;border-radius:16px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:'DM Sans',sans-serif;cursor:pointer;min-height:68px}
.today-day span{font-size:.66rem;font-weight:700;opacity:.9}
.today-day b{font-size:1.05rem;font-weight:800}
.today-day em{font-style:normal;font-size:.66rem;font-weight:800;opacity:.95}
.today-day.now{outline:3px solid var(--navy);outline-offset:2px}
.today-legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 4px 0;font-size:.8rem;font-weight:600;color:var(--text-muted)}
.today-legend span{display:inline-flex;align-items:center;gap:6px}
.today-legend i{width:20px;height:20px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:.66rem;font-weight:800}
.today-appt{width:100%;display:flex;align-items:center;gap:12px;background:var(--surface);border:none;border-radius:18px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow-sm);font-family:'DM Sans',sans-serif;text-align:left;cursor:pointer;color:var(--text)}
.today-appt i{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-style:normal;flex:none}
.today-appt-title{font-size:.92rem;font-weight:700}
.today-appt small{font-size:.76rem;color:var(--text-muted);font-weight:600}
.today-empty{font-size:.85rem;color:var(--text-muted);background:var(--surface);border-radius:16px;padding:14px}
.today-fab{position:fixed;right:20px;bottom:28px;width:58px;height:58px;border-radius:20px;border:none;background:var(--coral);color:#1f1f1f;font-size:1.8rem;font-weight:600;box-shadow:0 10px 22px rgba(240,138,108,.45);cursor:pointer;z-index:120}
/* Agenda list */
.agenda{display:flex;flex-direction:column}
.agenda-row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border:none;border-bottom:1px solid var(--border);background:var(--surface);text-align:left;font-family:'DM Sans',sans-serif;color:var(--text);cursor:pointer;min-height:60px}
.agenda-row.monday{border-top:2px solid var(--border-strong)}
.agenda-row.now{background:var(--accent-light)}
.agenda-date{width:40px;flex:none;text-align:center}
.agenda-date small{display:block;font-size:.66rem;font-weight:700;color:var(--text-muted);text-transform:uppercase}
.agenda-date b{font-size:1.2rem;font-weight:800}
.agenda-row.now .agenda-date b{color:#fff;background:var(--accent);border-radius:50%;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;font-size:1rem}
.agenda-main{flex:1;min-width:0}
.agenda-bar{display:flex;gap:2px;height:20px;border-radius:7px;overflow:hidden;margin-top:2px}
.agenda-bar i{flex:1;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.62rem;font-weight:800}
.agenda-who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:.86rem}
.agenda-appts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.agenda-chip{font-size:.72rem;font-weight:600;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:2px 8px;color:var(--text)}
.agenda-chip.handover{background:#fff4e0;border-color:#f3d39a;color:#7a4f00}
.agenda-chip.hol{background:var(--accent-light);border-color:#bfe0ea;color:var(--accent)}
.agenda-go{color:var(--text-light);font-size:1.3rem;align-self:center}
/* Phone layout */
@media (max-width:760px){
  body{font-size:15px}
  .app{padding:12px 12px calc(96px + env(safe-area-inset-bottom))}
  .app-header{margin-bottom:10px}
  .tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:150;width:auto;margin:0;
    background:var(--navy);border:none;border-radius:22px;padding:6px;justify-content:space-around;flex-wrap:nowrap;box-shadow:0 10px 30px rgba(19,41,61,.35)}
  .tab-btn{flex:1;flex-direction:column;gap:2px;padding:6px 0;min-height:52px;justify-content:center;color:#8aa3b6;border-radius:16px;font-size:.68rem}
  .tab-btn.active{background:rgba(255,255,255,.1);color:#fff;box-shadow:none}
  .tab-ico{font-size:1.25rem}
  .tab-dot{position:absolute;top:4px;right:calc(50% - 22px);margin:0}
  .btn{min-height:44px;padding:10px 16px;font-size:.88rem}
  .btn-xs{min-height:38px;padding:7px 12px;font-size:.8rem}
  .btn-icon{width:40px;height:40px}
  input,select,textarea{font-size:16px!important}
  .card,.share-card{border-radius:20px}
  .cal-nav{padding:12px}
  .view-selector{order:2;width:100%;display:flex}
  .view-btn{flex:1;min-height:38px}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom))}
  .demo-bar{bottom:calc(150px + env(safe-area-inset-bottom));right:10px}
  .today-fab{bottom:calc(92px + env(safe-area-inset-bottom));right:18px}
  .today-hero{border-radius:0 0 30px 30px;margin:-12px -12px 0;padding:calc(18px + env(safe-area-inset-top)) 18px 64px}
  .wiz-backdrop{align-items:flex-end;padding:0}
  .wiz-card{border-radius:24px 24px 0 0;max-height:92vh;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .appt-modal-backdrop{align-items:flex-end}
}
@media (min-width:761px){.today{max-width:560px;margin:0 auto}.today-fab{position:absolute;bottom:0;right:0}}

.filter-checks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filter-check{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:1.5px solid var(--border);cursor:pointer;font-size:.75rem;user-select:none;transition:border-color .15s}
.filter-check input{accent-color:var(--accent)}
.webcal-box{display:flex;gap:6px;align-items:center}
.webcal-url{flex:1;padding:7px 10px;border:1px solid var(--border-strong);border-radius:var(--r-sm);font-size:.7rem;font-family:monospace;background:var(--bg);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-instructions{margin-top:10px;font-size:.72rem;color:var(--text-muted);line-height:1.6}
.cal-instructions strong{color:var(--text)}
/* ── Responsive ── */
@media(max-width:640px){
  .app{padding:12px 8px 70px}

function getHolidayForDate(dateStr,calKey){
  if(!calKey||calKey==='none')return null;
  const cal=HOLIDAY_CALENDARS[calKey];
  if(!cal)return null;
  return cal.holidays.find(h=>dateStr>=h.start&&dateStr<=h.end)||null;
}
function formatHolidayDate(str){
  const d=new Date(str+"T00:00:00");
  return `${d.getDate()} ${MONTH_NAMES[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;
}
function getHolidayDuration(start,end){
  const s=new Date(start+"T00:00:00"),e=new Date(end+"T00:00:00");
  return Math.round((e-s)/86400000)+1;
}

// Build empty template row for all blocks + both weeks
function emptyWeekTpl(blocks){
  const week={};
  for(let d=0;d<7;d++){
    week[d]={};
    blocks.forEach(b=>{ week[d][b.id]="none" });
  }
  return week;
}

  return {week1:emptyWeekTpl(blocks),week2:emptyWeekTpl(blocks)};

/* ═══════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════ */
function getDaysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function dateKey(y,m,d){return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`}
function isToday(y,m,d){const t=new Date();return t.getFullYear()===y&&t.getMonth()===m&&t.getDate()===d}
function isWeekend(y,m,d){const w=new Date(y,m,d).getDay();return w===0||w===6}
// ISO week number for a date
function isoWeek(date){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));
  const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-yearStart)/86400000)+1)/7);
}
// Determine if a given day is week1 or week2 based on user's anchor date
// anchorDate (string YYYY-MM-DD) is known to be a Week-1 Monday
function getWeekParity(y,m,d,anchorStr){
  try{
    const anchor=new Date(anchorStr+"T00:00:00");
    const target=new Date(y,m,d);
    // get Monday of target week
    const dow=target.getDay();
    const mondayTarget=new Date(target);
    mondayTarget.setDate(target.getDate()-(dow===0?6:dow-1));
    // diff in weeks
    const diffMs=mondayTarget-anchor;
    const diffWeeks=Math.round(diffMs/(7*86400000));
    return diffWeeks%2===0?1:2;
  }catch{return 1}
}
// Demo mode (?demo): no login, everything stays on this device. Each browser tab is one "person".
// Demo is remembered on this device (handy for the home-screen app), until you choose "Leave demo".
const DEMO=(()=>{try{
  const q=new URLSearchParams(location.search);
  if(q.has("real")){localStorage.removeItem("ta_demo_on");return false}
  if(q.has("demo")||/demo/i.test(location.pathname)){localStorage.setItem("ta_demo_on","1");return true}
  return localStorage.getItem("ta_demo_on")==="1";
}catch{return false}})();
function demoUid(){try{return sessionStorage.getItem("ta_demo_uid")||"anon"}catch{return"anon"}}
function lsKey(k){return DEMO?`demo:${demoUid()}:${k}`:k}
function loadLS(k,fb){try{const v=localStorage.getItem(lsKey(k));return v?JSON.parse(v):fb}catch{return fb}}
function saveLS(k,v){try{localStorage.setItem(lsKey(k),JSON.stringify(v))}catch{}}
// Merge: override > template > none
function resolveCell(dateStr,blockId,weekTemplate,overrides,weekParity){
  const tplWeek=weekParity===1?weekTemplate.week1:weekTemplate.week2;
  const dow=new Date(dateStr+"T00:00:00").getDay();
  const tplVal=tplWeek?.[dow]?.[blockId]??"none";
  const ov=overrides[dateStr]?.[blockId];
  return{
    assigneeId: ov?.assigneeId??tplVal,
    note:       ov?.note??"",
    isOverride: ov!=null,
    isTemplate: ov==null && tplVal!=="none",
  };
}
/* ═══════════════════════════════════════════════
   USEOUTSIDECLICK
═══════════════════════════════════════════════ */
function useOutsideClick(ref,cb){
  useEffect(()=>{
    function h(e){if(ref.current&&!ref.current.contains(e.target))cb()}
    document.addEventListener("mousedown",h);
    return()=>document.removeEventListener("mousedown",h);
  },[cb]);
}
/* ═══════════════════════════════════════════════
   ASSIGNEE PICKER (dropdown)
═══════════════════════════════════════════════ */
function AssigneePicker({value,assignees,onSelect,onAddNew,onClose,anchorRect}){
  const ref=useRef(null);
  const [adding,setAdding]=useState(false);
  const [newLabel,setNewLabel]=useState("");
  const [newPal,setNewPal]=useState(0);
  // Position fixed dropdown near anchor
  const style=useMemo(()=>{
    if(!anchorRect)return{top:100,left:100};
    const top=anchorRect.bottom+4;
    let left=anchorRect.left;
    // prevent overflow right
    const w=180;
    if(left+w>window.innerWidth-8)left=window.innerWidth-w-8;
    return{top,left,width:w};
  },[anchorRect]);
  useOutsideClick(ref,onClose);
  function handleAdd(){
    if(!newLabel.trim())return;
    const id="c_"+Date.now();
    onAddNew({id,label:newLabel.trim(),...PALETTE[newPal],builtIn:false});
    onSelect(id);
    onClose();
  }
  return(
    <div ref={ref} className="picker-dropdown" style={{...style,position:"fixed"}}>
      {!adding?(
        <>
          {Object.values(assignees).map(a=>(
            <div key={a.id} className={`picker-item${a.id===value?" active":""}`}
              onClick={()=>{onSelect(a.id);onClose()}}>
              <span className="p-swatch" style={{background:a.bg,border:`1px solid ${a.fg}44`}}/>
              {a.label}
            </div>
          ))}
          <div className="picker-sep"/>
          <div className="picker-item picker-muted" onClick={()=>setAdding(true)}>＋ Add custom…</div>
        </>
      ):(
        <div className="add-inline">
          <input autoFocus placeholder="Label (e.g. Grandma)"
            value={newLabel} onChange={e=>setNewLabel(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&handleAdd()}/>
          <div className="palette-row">
            {PALETTE.map((p,i)=>(
              <div key={i} className={`pal-dot${newPal===i?" on":""}`}
                style={{background:p.bg,borderColor:newPal===i?p.fg:"transparent"}}
                onClick={()=>setNewPal(i)}/>
            ))}
          </div>
          <div className="add-row">
            <button className="btn btn-accent btn-xs" onClick={handleAdd}>Save</button>
            <button className="btn btn-ghost btn-xs" onClick={()=>setAdding(false)}>Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}
/* ═══════════════════════════════════════════════
   NOTE POPOVER
═══════════════════════════════════════════════ */
function NotePopover({note,blockLabel,dateLabel,anchorRect,onSave,onClose,readOnly}){
  const [val,setVal]=useState(note||"");
  const ref=useRef(null);
  useOutsideClick(ref,()=>{if(!readOnly)onSave(val);onClose()});
  const style=useMemo(()=>{
    if(!anchorRect)return{top:100,left:100};
    let top=anchorRect.bottom+6;
    let left=anchorRect.left;
    if(left+260>window.innerWidth-8)left=window.innerWidth-268;
    if(top+200>window.innerHeight-8)top=anchorRect.top-206;
    return{top,left};
  },[anchorRect]);
  return(
    <div ref={ref} className="note-popover" style={{...style,position:"fixed"}}>
      <h4>📝 {blockLabel} · <span style={{fontStyle:"italic",fontWeight:400}}>{dateLabel}</span></h4>
      <textarea autoFocus={!readOnly} readOnly={!!readOnly} placeholder="Add a note… e.g. 'Doctor at 15:00'" value={val}
        onChange={e=>setVal(e.target.value)}
        onKeyDown={e=>{if(e.key==="Escape"){if(!readOnly)onSave(val);onClose()}}}/>
      <div className="note-actions">
        {!readOnly&&val&&<button className="btn btn-danger btn-xs" onClick={()=>{onSave("");onClose()}}>Clear</button>}
        <button className="btn btn-ghost btn-xs" onClick={()=>{if(!readOnly)onSave(val);onClose()}}>{readOnly?"Close":"Done"}</button>
      </div>
    </div>
  );
}

   BLOCK CELL
═══════════════════════════════════════════════ */
function BlockCell({dateStr,blockId,blockLabel,assignees,weekTemplate,overrides,weekParity,
                    onSetAssignee,onSetNote,activePickerKey,setActivePickerKey,
                    activeNoteKey,setActiveNoteKey}){
  const {assigneeId,note,isOverride,isTemplate}=resolveCell(dateStr,blockId,weekTemplate,overrides,weekParity);
  const a=assignees[assigneeId]||assignees["none"];
  const cellKey=dateStr+"|"+blockId;
  const btnRef=useRef(null);
  const [btnRect,setBtnRect]=useState(null);
  const noteRef=useRef(null);
  const [noteRect,setNoteRect]=useState(null);
  const readOnly=!onSetAssignee;
  function openPicker(e){
    e.stopPropagation();
    if(readOnly)return;
    const r=btnRef.current?.getBoundingClientRect();
    setBtnRect(r||null);
    setActivePickerKey(prev=>prev===cellKey?null:cellKey);
    setActiveNoteKey(null);
  }
  function openNote(e){
    e.stopPropagation();
    const r=noteRef.current?.getBoundingClientRect();
    setNoteRect(r||null);
    setActiveNoteKey(prev=>prev===cellKey?null:cellKey);
    setActivePickerKey(null);
  }
  const pickerOpen=activePickerKey===cellKey;
  const noteOpen=activeNoteKey===cellKey;
  const dateObj=new Date(dateStr+"T00:00:00");
  const dateLabel=`${DAY_NAMES_SHORT[dateObj.getDay()]} ${dateObj.getDate()} ${MONTH_NAMES[dateObj.getMonth()].slice(0,3)}`;
  return(
    <div className="block-cell">
      <button ref={btnRef}
        className={`assign-btn${isTemplate?" is-template":""}${isOverride?" is-override":""}`}
        style={{background:a.bg,color:a.fg,borderColor:isTemplate?a.fg+"66":"transparent",cursor:readOnly?"default":undefined}}
        onClick={openPicker}>
        <span className="assign-label">{a.label}</span>
        <span className="assign-icons">
          {note&&<span className="note-dot" title={note}/>}
          {(!readOnly||note)&&(
            <button ref={noteRef} className="note-btn-inline" onClick={openNote}
              title={readOnly?"View note":note?"Edit note":"Add note"} onMouseDown={e=>e.stopPropagation()}>
              {readOnly?"📝":note?"✏️":"＋"}
            </button>
          )}
        </span>
      </button>
      {pickerOpen&&btnRect&&(
        <>
          <div className="overlay-backdrop" onClick={()=>setActivePickerKey(null)}/>
          <AssigneePicker
            value={assigneeId} assignees={assignees}
            anchorRect={btnRect}
            onSelect={id=>onSetAssignee(dateStr,blockId,id)}
            onAddNew={a=>onSetAssignee(dateStr,blockId,a.id,a)}
            onClose={()=>setActivePickerKey(null)}/>
        </>
      )}
      {noteOpen&&noteRect&&(
        <>

/* ═══════════════════════════════════════════════
   APPOINTMENT MODAL

function AppointmentModal({dateLabel,appt,onSave,onDelete,onClose,pickDate}){
  const [title,setTitle]=useState(appt?.title||"");
  const [dk,setDk]=useState(pickDate||"");
  const [time,setTime]=useState(appt?.time||"");
  const [colorIdx,setColorIdx]=useState(appt?.colorIdx??0);
  const c=APPT_COLORS[colorIdx];
  function handleSave(){
    if(!title.trim())return;
    onSave({id:appt?.id||("a_"+Date.now()),title:title.trim(),time,colorIdx},pickDate?dk:undefined);
    onClose();
  }
  return(
    <div className="appt-modal-backdrop" onClick={onClose}>
      <div className="appt-modal" onClick={e=>e.stopPropagation()}>
        <h3>{appt?"Edit appointment":"New appointment"}</h3>
        {pickDate?(
          <div><label>Day</label><input type="date" value={dk} onChange={e=>setDk(e.target.value)}/></div>
        ):(<div style={{color:"var(--text-muted)",fontSize:".78rem",marginTop:-6}}>📅 {dateLabel}</div>)}
        <div>
          <label>Title</label>
          <input type="text" placeholder="e.g. Doctor, School play…"
            value={title} onChange={e=>setTitle(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&handleSave()} autoFocus/>
        </div>
        <div>
          <label>Time (optional)</label>
          <input type="time" value={time} onChange={e=>setTime(e.target.value)}/>
          {time&&<div className="appt-time-big" style={{color:c.fg}}>{time}</div>}
        </div>
        <div>
          <label>Color</label>
          <div className="appt-colors">
            {APPT_COLORS.map((col,i)=>(
              <div key={i} className={`appt-color-dot${colorIdx===i?" selected":""}`}
                style={{background:col.bg,borderColor:colorIdx===i?col.fg:"transparent"}}
                onClick={()=>setColorIdx(i)}/>

        </div>

          {appt&&<button className="btn btn-danger btn-xs" onClick={()=>{onDelete(appt.id);onClose()}}>Delete</button>}

/* ═══════════════════════════════════════════════
   MONTH SUMMARY
═══════════════════════════════════════════════ */
function MonthSummary({year,month,timeBlocks,assignees,weekTemplate,overrides,anchorDate}){
  const counts=useMemo(()=>{
    const c={};
    const days=getDaysInMonth(year,month);
    for(let d=1;d<=days;d++){
      const dStr=dateKey(year,month,d);
      const wp=getWeekParity(year,month,d,anchorDate);
      timeBlocks.forEach(b=>{
        const {assigneeId}=resolveCell(dStr,b.id,weekTemplate,overrides,wp);
        if(assigneeId!=="none")c[assigneeId]=(c[assigneeId]||0)+1;
      });
    }
    return c;
  },[year,month,timeBlocks,assignees,weekTemplate,overrides,anchorDate]);
  const total=Object.values(counts).reduce((s,n)=>s+n,0);
  const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  return(
    <div className="summary">
      <div className="summary-bar">
        {sorted.map(([id,n])=>{
          const a=assignees[id];
          if(!a)return null;
          return<div key={id} className="summary-fill" style={{width:`${(n/total)*100}%`,background:a.fg+"88"}}/>;
        })}
      </div>
      <div className="summary-chips">
        {sorted.map(([id,n])=>{
          const a=assignees[id];
          if(!a)return null;
          return(
            <span key={id} className="s-chip" style={{background:a.bg,color:a.fg}}>
              {a.label} · {n}{total?` (${Math.round(n/total*100)}%)`:""}
            </span>
          );
        })}
        {total===0&&<span style={{fontSize:".73rem",color:"var(--text-muted)"}}>No blocks assigned yet — try the Weekly Template tab!</span>}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   YEAR VIEW
═══════════════════════════════════════════════ */
function YearViewPanel({year,timeBlocks,assignees,weekTemplate,overrides,anchorDate,onGoMonth}){
  // Get dominant assignee color for a day
  function dayColor(y,m,d){
    const dStr=dateKey(y,m,d);
    const wp=getWeekParity(y,m,d,anchorDate);
    const counts={};
    timeBlocks.forEach(b=>{
      const {assigneeId}=resolveCell(dStr,b.id,weekTemplate,overrides,wp);
      if(assigneeId!=="none")counts[assigneeId]=(counts[assigneeId]||0)+1;
    });
    const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
    if(!top)return null;
    return assignees[top[0]]||null;
  }
  const todayStr=dateKey(...(()=>{const t=new Date();return[t.getFullYear(),t.getMonth(),t.getDate()]})());
  return(
    <div className="year-grid">
      {Array.from({length:12},(_,m)=>{
        const days=getDaysInMonth(year,m);
        const firstDow=new Date(year,m,1).getDay(); // 0=Sun
        const offset=(firstDow===0?6:firstDow-1); // Mon-based offset
        return(
          <div key={m} className="mini-cal" onClick={()=>onGoMonth(m)} style={{cursor:"pointer"}}>
            <div className="mini-cal-title">{MONTH_NAMES[m]}</div>
            <div className="mini-cal-grid">
              {["M","T","W","T","F","S","S"].map((d,i)=>(
                <div key={i} className="mini-dow">{d}</div>
              ))}
              {Array.from({length:offset},(_,i)=>(
                <div key={"e"+i}/>
              ))}
              {Array.from({length:days},(_,i)=>{
                const d=i+1;
                const dStr=dateKey(year,m,d);
                const col=dayColor(year,m,d);
                const isToday=dStr===todayStr;
                return(
                  <div key={d} className={`mini-day${isToday?" today":""}`}
                    style={{background:col?col.bg:"transparent",color:col?col.fg:"var(--text-light)"}}>
                    {d}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}
/* ═══════════════════════════════════════════════
   CALENDAR VIEW (router)
═══════════════════════════════════════════════ */
function CalendarView({year,month,setYear,setMonth,timeBlocks,assignees,weekTemplate,
                       overrides,anchorDate,onSetAssignee,onSetNote,holidayCalKey,
                       appointments,onSaveAppt,onDeleteAppt,openDay}){
  const [view,setView]=useState(()=>loadLS("ta_calview",(typeof window!=="undefined"&&window.innerWidth<760)?"list":"month"));
  const [day,setDay]=useState(()=>new Date().getDate());
  const [activePickerKey,setActivePickerKey]=useState(null);
  const [activeNoteKey,setActiveNoteKey]=useState(null);
  useEffect(()=>{if(openDay){setYear(openDay.y);setMonth(openDay.m);setDay(openDay.d);setView("day")}},[openDay]);
  // Week start (Monday) for week view
  const weekStart=useMemo(()=>{
    const d=new Date(year,month,day);
    const dow=d.getDay();
    const monday=new Date(d);
    monday.setDate(d.getDate()-(dow===0?6:dow-1));
    return monday;
  },[year,month,day]);
  function goToday(){
    const t=new Date();
    setYear(t.getFullYear());setMonth(t.getMonth());setDay(t.getDate());
  }
  function navigate(dir){
    if(view==="day"){
      const d=new Date(year,month,day+dir);
      setYear(d.getFullYear());setMonth(d.getMonth());setDay(d.getDate());
    }else if(view==="week"){
      const d=new Date(weekStart);d.setDate(d.getDate()+dir*7);
      setYear(d.getFullYear());setMonth(d.getMonth());setDay(d.getDate());
    }else if(view==="month"||view==="list"){
      let nm=month+dir,ny=year;
      if(nm<0){nm=11;ny--}if(nm>11){nm=0;ny++}
      setYear(ny);setMonth(nm);
    }else if(view==="year"){
      setYear(y=>y+dir);
    }
  }
  function goDay(y,m,d){setYear(y);setMonth(m);setDay(d);setView("day");saveLS("ta_calview","day")}
  function goMonth(m){setMonth(m);setView("month");saveLS("ta_calview","month")}
  function navTitle(){
    if(view==="day")return`${DAY_NAMES_FULL[new Date(year,month,day).getDay()]} ${day} ${MONTH_NAMES[month]} ${year}`;
    if(view==="week"){
      const wEnd=new Date(weekStart);wEnd.setDate(wEnd.getDate()+6);
      return`${weekStart.getDate()} ${MONTH_NAMES[weekStart.getMonth()].slice(0,3)} – ${wEnd.getDate()} ${MONTH_NAMES[wEnd.getMonth()].slice(0,3)} ${wEnd.getFullYear()}`;
    }
    if(view==="month"||view==="list")return`${MONTH_NAMES[month]} ${year}`;
    return`${year}`;
  }
  const wp1=view==="month"?getWeekParity(year,month,1,anchorDate):null;
  return(
    <div className="card">
      <div className="cal-nav">
        <div className="cal-nav-left">
          <h2 className="cal-title">{navTitle()}</h2>
          {wp1&&<span className={`week-badge w${wp1}`}>Starts W{wp1}</span>}
        </div>
        <div className="cal-nav-right" style={{gap:6,flexWrap:"wrap"}}>
          <div className="view-selector">
            {["list","day","week","month","year"].map(v=>(
              <button key={v} className={`view-btn${view===v?" active":""}`}
                onClick={()=>{setView(v);saveLS("ta_calview",v);}}>{v.charAt(0).toUpperCase()+v.slice(1)}</button>
            ))}
          </div>
          <button className="btn-icon today-btn btn" style={{width:"auto",padding:"0 10px",fontSize:".73rem"}} onClick={goToday}>Today</button>
          <button className="btn-icon" onClick={()=>navigate(-1)} aria-label="Prev">‹</button>
          <button className="btn-icon" onClick={()=>navigate(1)} aria-label="Next">›</button>
        </div>
      </div>
      {view==="list"&&(
        <AgendaList year={year} month={month} timeBlocks={timeBlocks} assignees={assignees}
          weekTemplate={weekTemplate} overrides={overrides} anchorDate={anchorDate}
          holidayCalKey={holidayCalKey} appointments={appointments} onGoDay={goDay}/>
      )}
      {view==="month"&&(<>

function TplCell({activeWeek,dow,block,assignees,weekTemplate,activePickerKey,setActivePickerKey,onSetSlot}){

    <div className="block-cell" style={{position:"relative"}}>

function TimeBlocksEditor({timeBlocks,setTimeBlocks,notify}){
  const [newLabel,setNewLabel]=useState("");
  const [newIcon,setNewIcon]=useState("⭐");
  const dragIdx=useRef(null);
  const [dragOver,setDragOver]=useState(null);
  function addBlock(){
    if(!newLabel.trim())return;
    const id="blk_"+Date.now();
    setTimeBlocks(prev=>[...prev,{id,label:newLabel.trim(),icon:newIcon}]);
    setNewLabel("");setNewIcon("⭐");
  }
  function removeBlock(id){
    const before=timeBlocks;
    const b=timeBlocks.find(x=>x.id===id);
    setTimeBlocks(prev=>prev.filter(x=>x.id!==id));
    notify(`“${b?b.label:"Block"}” removed`,()=>setTimeBlocks(before));
  }
  function move(i,dir){
    const j=i+dir;
    if(j<0||j>=timeBlocks.length)return;
    setTimeBlocks(prev=>{const arr=[...prev];[arr[i],arr[j]]=[arr[j],arr[i]];return arr});
  }
  function updateLabel(id,val){setTimeBlocks(prev=>prev.map(b=>b.id===id?{...b,label:val}:b))}
  function updateIcon(id,icon){setTimeBlocks(prev=>prev.map(b=>b.id===id?{...b,icon}:b))}
  function onDragStart(i){dragIdx.current=i}
  function onDragOver(e,i){e.preventDefault();setDragOver(i)}
  function onDrop(i){
    const from=dragIdx.current;
    if(from==null||from===i)return;
    setTimeBlocks(prev=>{const arr=[...prev];const[item]=arr.splice(from,1);arr.splice(i,0,item);return arr});
    dragIdx.current=null;setDragOver(null);
  }
  return(
    <div className="card">
      <div className="section-head"><div className="section-title">Time Blocks</div><div className="section-sub">Use ▲▼ (or drag on desktop) to reorder · tap the icon to change it · edit the name inline.</div></div>
      <div className="section-body">
        {timeBlocks.map((b,i)=>(
          <div key={b.id} className={`tbl-row${dragOver===i?" drag-over":""}`}
            draggable onDragStart={()=>onDragStart(i)} onDragOver={e=>onDragOver(e,i)} onDrop={()=>onDrop(i)} onDragLeave={()=>setDragOver(null)}>
            <span className="drag-handle" title="Drag to reorder">⠿</span>
            <div className="move-btns">
              <button className="move-btn" title="Move up" disabled={i===0} onClick={()=>move(i,-1)}>▲</button>
              <button className="move-btn" title="Move down" disabled={i===timeBlocks.length-1} onClick={()=>move(i,1)}>▼</button>
            </div>
            <IconPicker value={b.icon} onChange={ic=>updateIcon(b.id,ic)}/>
            <input className="tbl-label-input" value={b.label} onChange={e=>updateLabel(b.id,e.target.value)}/>
            <button className="btn btn-danger btn-xs" title="Remove" onClick={()=>removeBlock(b.id)} disabled={timeBlocks.length<=1}>✕</button>
          </div>
        ))}
        <div className="tbl-add-row">
          <IconPicker value={newIcon} onChange={setNewIcon}/>
          <input className="tbl-label-input" placeholder="New block name…" value={newLabel}
            onChange={e=>setNewLabel(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addBlock()}/>
          <button className="btn btn-accent btn-xs" onClick={addBlock}>Add</button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   COLOUR-BLIND SAFE COLOURS
   Parents = blue vs orange (stays distinct for protan/deutan/tritan vision);
   text colour per background meets WCAG AA (4.5:1). Older schedules are upgraded on load.
═══════════════════════════════════════════════ */
const OLD_BUILTIN_BG={mommy:["#f2d9e0"],daddy:["#d6e8f5"],school:["#d5f0e0","#cfe9e1"],none:["#f0ede8","#eef1f4"]};
const OLD_PALETTE_BG=["#f2d9e0","#d6e8f5","#d5f0e0","#fde8c8","#e8d9f5","#fdf0c8","#d9eef5","#f5ddd9","#e8f5d9","#f5e8d9"];
function upgradeAssignees(as){
  if(!as||typeof as!=="object")return as;
  let changed=false;const out={};
  for(const [id,a] of Object.entries(as)){
    let n=a;
    if(a&&DEFAULT_ASSIGNEES[id]&&OLD_BUILTIN_BG[id]&&OLD_BUILTIN_BG[id].includes(String(a.bg).toLowerCase())){
      n={...a,bg:DEFAULT_ASSIGNEES[id].bg,fg:DEFAULT_ASSIGNEES[id].fg};
    }else if(a&&!a.builtIn){
      const i=OLD_PALETTE_BG.indexOf(String(a.bg).toLowerCase());
      if(i>=0&&PALETTE[i])n={...a,...PALETTE[i]};
    }
    if(n!==a)changed=true;
    out[id]=n;
  }
  return changed?out:as;
}
/* ═══════════════════════════════════════════════
   DAY HELPERS (who has the children on a day)
═══════════════════════════════════════════════ */
const KID_AVATARS=["🦁","🦋","🐻","🦊","🐢","🐳","🦉","🐰"];
function parseKey(dStr){const [y,m,d]=dStr.split("-").map(Number);return[y,m-1,d]}
function keyOf(date){return dateKey(date.getFullYear(),date.getMonth(),date.getDate())}
function dayInfo(dStr,ctx){
  const [y,m,d]=parseKey(dStr);
  const wp=getWeekParity(y,m,d,ctx.anchorDate);
  const segments=ctx.timeBlocks.map(b=>{
    const {assigneeId}=resolveCell(dStr,b.id,ctx.weekTemplate,ctx.overrides,wp);
    return{block:b,id:assigneeId,a:ctx.assignees[assigneeId]||ctx.assignees.none||DEFAULT_ASSIGNEES.none};
  });
  const counts={};
  segments.forEach(s=>{if(s.id!=="none"&&s.id!=="school")counts[s.id]=(counts[s.id]||0)+1});
  const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  const mainId=top?top[0]:(segments.find(s=>s.id!=="none")||{}).id||"none";
  return{segments,mainId,main:ctx.assignees[mainId]||ctx.assignees.none||DEFAULT_ASSIGNEES.none};
}
function initialOf(a){return(a&&a.id!=="none"&&a.label?a.label.trim().charAt(0).toUpperCase():"·")}
function firstNameFromEmail(email){
  const p=String(email||"").split("@")[0].split(/[._\-+0-9]/)[0];
  return p?p.charAt(0).toUpperCase()+p.slice(1):"there";
}
function niceDate(dStr,withDow=true){
  const [y,m,d]=parseKey(dStr);const dt=new Date(y,m,d);
  return`${withDow?DAY_NAMES_SHORT[dt.getDay()]+" ":""}${d} ${MONTH_NAMES[m].slice(0,3)}`;
}
/* ═══════════════════════════════════════════════
   TODAY VIEW (home screen, design B)
═══════════════════════════════════════════════ */
function TodayView({session,calName,children,assignees,timeBlocks,weekTemplate,overrides,anchorDate,
                    appointments,holidayCalKey,onOpenDay,onSaveAppt,headerExtras}){
  const ctx={assignees,timeBlocks,weekTemplate,overrides,anchorDate};
  const today=new Date();const todayKey=keyOf(today);
  const info=dayInfo(todayKey,ctx);
  const [addOpen,setAddOpen]=useState(false);
  // next handover: first day whose main person differs from today's
  const handover=useMemo(()=>{
    for(let i=1;i<=60;i++){
      const dt=new Date(today);dt.setDate(dt.getDate()+i);
      const k=keyOf(dt);const di=dayInfo(k,ctx);
      if(di.mainId!==info.mainId&&di.mainId!=="none")return{key:k,days:i,to:di.main};
    }
    return null;
  },[assignees,timeBlocks,weekTemplate,overrides,anchorDate,todayKey]);
  // this week Mon..Sun
  const monday=new Date(today);monday.setDate(today.getDate()-((today.getDay()+6)%7));
  const week=Array.from({length:7},(_,i)=>{const dt=new Date(monday);dt.setDate(monday.getDate()+i);const k=keyOf(dt);return{k,dt,info:dayInfo(k,ctx)}});
  const usedIds=[...new Set(week.map(w=>w.info.mainId).filter(id=>id!=="none"))];
  // within-day switches today (e.g. evening with the other parent)
  const switches=info.segments.filter(s=>s.id!==info.mainId&&s.id!=="none"&&s.id!=="school");
  // holidays
  const holToday=getHolidayForDate(todayKey,holidayCalKey);
  const nextHol=useMemo(()=>{
    const cal=HOLIDAY_CALENDARS[holidayCalKey];if(!cal)return null;
    const h=cal.holidays.filter(x=>x.start>todayKey).sort((a,b)=>a.start<b.start?-1:1)[0];
    if(!h)return null;
    const [y,m,d]=parseKey(h.start);const days=Math.round((new Date(y,m,d)-new Date(today.getFullYear(),today.getMonth(),today.getDate()))/864e5);
    return days<=45?{...h,days}:null;
  },[holidayCalKey,todayKey]);
  // upcoming appointments (14 days)
  const upcoming=[];
  for(let i=0;i<14;i++){
    const dt=new Date(today);dt.setDate(dt.getDate()+i);const k=keyOf(dt);
    (appointments[k]||[]).slice().sort((a,b)=>(a.time||"99").localeCompare(b.time||"99")).forEach(ap=>upcoming.push({k,ap,i}));
  }
  const kids=children||[];
  const who=info.main;
  return(
    <div className="today">
      <div className="today-hero">
        <div className="today-hero-row">
          <div>
            <div className="today-hello">Hi {firstNameFromEmail(session.user.email)} 👋</div>
            {headerExtras}
          </div>
        </div>
        {kids.length>0&&(
          <div className="today-kids">
            {kids.map((k,i)=>(<span key={k.id} className="today-kid"><i>{KID_AVATARS.at(i%KID_AVATARS.length)}</i>{k.name}</span>))}
          </div>
        )}
      </div>
      <div className="today-card">
        <div className="today-label">Today · {niceDate(todayKey)}</div>
        <div className="today-who">
          <span className="who-badge" style={{background:who.bg,color:who.fg}} aria-hidden="true">{initialOf(who)}</span>
          <div>
            <div className="today-who-name">{info.mainId==="none"?"Nothing planned yet":`With ${who.label}`}</div>
            {switches.length>0&&<div className="today-who-sub">{switches.map(s=>`${s.block.label}: ${s.a.label}`).join(" · ")}</div>}
          </div>
        </div>

function AgendaList({year,month,timeBlocks,assignees,weekTemplate,overrides,anchorDate,holidayCalKey,appointments,onGoDay}){

    <div className="agenda">

        const info=dayInfo(k,ctx);
        const hol=getHolidayForDate(k,holidayCalKey);
        const appts=(appointments[k]||[]).slice().sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
        const prev=d>1?dayInfo(dateKey(year,month,d-1),ctx).mainId:null;
        const isHandover=prev&&prev!==info.mainId&&info.mainId!=="none";

          <button key={d} className={`agenda-row${k===todayKey?" now":""}${dt.getDay()===1?" monday":""}`} onClick={()=>onGoDay(year,month,d)}>

              </div>
              <div className="agenda-who">

              )}

            <span className="agenda-go" aria-hidden="true">›</span>
          </button>
        );
      })}
    </div>
  );
}

/* ═══════════════════════════════════════════════
   CUSTODY PRESETS (used by the setup wizard + demo family)
   days: 14 letters, Monday week 1 … Sunday week 2. A = parent 1, B = parent 2
═══════════════════════════════════════════════ */
const CUSTODY_PRESETS=[
  {id:"weekly",name:"Week on / week off",desc:"Each parent has the children for a full week, alternating.",days:"AAAAAAABBBBBBB"},
  {id:"2255",name:"2-2-5-5",desc:"Fixed weekdays (parent 1: Mon–Tue, parent 2: Wed–Thu); weekends alternate.",days:"AABBAAAAABBBBB"},
  {id:"223",name:"2-2-3",desc:"Two days, two days, three days — the pattern swaps every week.",days:"AABBAAABBAABBB"},
  {id:"eow",name:"Every other weekend",desc:"Children live with parent 1; parent 2 has every other weekend (Fri–Sun).",days:"AAAABBBAAAAAAA"},
  {id:"custom",name:"I'll set it up myself",desc:"Start with an empty fortnight and fill it in on the Templates tab.",days:null},
];
function buildPresetTemplate(presetId,blocks,opts){
  const o=opts||{};
  const p=CUSTODY_PRESETS.find(x=>x.id===presetId);
  const t=emptyTemplates(blocks);
  if(!p||!p.days)return t;
  for(let i=0;i<14;i++){
    const wk=i<7?"week1":"week2";
    const dow=(i%7+1)%7; // 0 = Sunday
    let who=p.days[i];
    if(o.swap)who=who==="A"?"B":"A";
    const id=who==="A"?"mommy":"daddy";
    blocks.forEach(b=>{
      const isSchool=o.school&&(i%7)<5&&(b.id==="daytime"||b.id==="lunch");
      t[wk][dow][b.id]=isSchool?"school":id;
    });
  }
  return t;
}

    if(q.table==="calendar_data"){

      select(c){if(q.op!=="update")q.cols=c||"*";return b},
      eq(c,v){q.filters.push([c,v]);return b},
      order(){return b},
      maybeSingle(){q.single=true;return b},
